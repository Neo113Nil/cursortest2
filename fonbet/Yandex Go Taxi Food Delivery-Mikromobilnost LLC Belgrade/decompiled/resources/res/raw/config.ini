[Parameters\Protocols\"DTLS 1.2"\Server]
# Временно отключаем по умолчанию при установке
Enabled = 0

# Настройки TLS
[Parameters\Protocols\"TLS 1.3"\Client]
# Разрешаем использование при явном запросе
DisabledByDefault = 1

[Parameters\Protocols\"TLS 1.3"\Server]
# Разрешаем использование при явном запросе
DisabledByDefault = 1

