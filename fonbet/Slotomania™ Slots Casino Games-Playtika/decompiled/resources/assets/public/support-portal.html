<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>SupportPortal</title>
    <style>
        html, body {
            background-color: transparent;
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            cursor: default;
            position: absolute;
            left: 0;
            top: 0;
        }
    </style>
    <script type="text/javascript" src="./client/support-portal-sdk.js"></script>
</head>
<body>
<script type="text/javascript">
    function getOS() {
        var userAgent = navigator.userAgent || navigator.vendor || window.opera;
        if (/android/i.test(userAgent)) {
            return "Android";
        }
        if (/iPad|iPhone|iPod|AppleWebKit/.test(userAgent) && !window.MSStream) {
            return "iOS";
        }
        return "unknown";
    }

    function postMessage(message) {
        var dataStringified = typeof message === "string" ? message : JSON.stringify(message);
        if (getOS() === "iOS") {
            window.webkit.messageHandlers.postMessageListener.postMessage(dataStringified);
        } else {
            WebApp.postMessage(dataStringified);
        }
    }

    window.__main__ = function (configStringified) {
        try {
            var config = JSON.parse(configStringified);
            var minimized = false;
            var service = new supportPortalSdk.SupportPortalService({
                portalUrl: config.portalUrl,
                apiGatewayUrl: config.apiGatewayUrl,
                sessionToken: function () { return config.sessionToken; },
                onSupportPortalFrameClosed: function () {
                    if (!minimized) {
                        postMessage("SupportPortalEvent.close");
                    }
                },
                onWidgetMinimized: function (payload) {
                    minimized = true;
                    postMessage("SupportPortalEvent.minimize:" + JSON.stringify(payload));
                },
                onDeeplinkClick: function (deeplink, closePortal) {
                    postMessage("SupportPortalEvent.deeplink:" + deeplink);
                },
                onExitCode: function (payload) {
                    postMessage("SupportPortalEvent.exitCode:" + JSON.stringify(payload));
                },
                onWidgetMessage: function (message) {
                    postMessage("SupportPortalEvent.widgetMessage:" + JSON.stringify(message));
                },
                onOverlayShow: function (container) {
                    container.style.background = "transparent";
                    return container;
                },
                onPortalWindowShow: function (container) {
                    container.style.width = "100%";
                    container.style.height = "100%";
                    container.style.maxWidth = "100%";
                    container.style.maxHeight = "100%";
                    container.style.margin = "0";
                    container.style.top = "0";
                    container.style.left = "0";
                    container.style.transform = "none";
                    return container;
                },
            });

            var openOptions = {};
            if (config.supportSessionId) {
                openOptions.supportSessionId = config.supportSessionId;
                openOptions.target = config.target;
            }

            window.__onGameMessage = function (message) {
                try {
                    var parsed = typeof message === "string" ? JSON.parse(message) : message;
                    service.sendMessage(parsed);
                } catch (e) {
                    console.log("[SupportPortal] __onGameMessage error: " + e);
                }
            };

            service.initialize()
                .then(function () {
                    return service.open(openOptions);
                })
                .catch(function (error) {
                    if (!minimized) {
                        postMessage("SupportPortalEvent.error " + error);
                    }
                });
        } catch (ex) {
            postMessage("SupportPortalEvent.error " + ex);
        }
    };

    window.displayFlashScreenshot = function () {};
    window.hideFlashScreenshot = function () {};
    window.activateTab = function () {};

    if (getOS() === "iOS") {
        window.webkit.messageHandlers.getInitData.postMessage({});
    } else {
        window.__main__(WebApp.getInitData());
    }
</script>

</body>
</html>
