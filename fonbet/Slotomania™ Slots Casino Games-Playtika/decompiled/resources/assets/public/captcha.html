<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>CAPTCHA</title>
<style>
    html, body {
        background-color: transparent;
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        cursor: default;
        position: absolute;
        left: 0;
        top: 0;
    }

    .center {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }
</style>
</head>
<body>
<div id="captcha-div" class="center"></div>
<script type="text/javascript">
    function getOS() {
        var userAgent = navigator.userAgent || navigator.vendor || window.opera;
        if (/windows phone/i.test(userAgent)) {
            return "Windows Phone";
        }
        if (/android/i.test(userAgent)) {
            return "Android";
        }
        if (/iPad|iPhone|iPod|AppleWebKit/.test(userAgent) && !window.MSStream) {
            return  "iOS";
        }
        return "unknown";
    }

    function postMessage(message) {
        if (getOS() === "iOS") {
            window.webkit.messageHandlers.postMessageListener.postMessage(message);
        } else {
            WebApp.postMessage(message);
        }
    }

    function handleToken() {
        console.log("[CAPTCHA] verification passed");
        postMessage("Captcha.close");
    }

    function onloadCallback() {
        console.log("[CAPTCHA] rendering");
        grecaptcha.render("captcha-div", {
            // FIXME: use real CAPTCHA key, not mine.
            sitekey: "6LcJqBcmAAAAAOpNG6jfVzAaM5Kml_sHkaoy0nfc",
            callback: "handleToken",
            'expired-callback': function () {
                grecaptcha.reset();
                console.log('[CAPTCHA] recaptcha reset');
            },
            'error-callback': function () {
                grecaptcha.reset();
                console.log('[CAPTCHA] recaptcha error');
            },
        });

        // Unfortunately, no onLoaded event for grecaptcha
        // Temporary solution for PoC
        setInterval(() =>
        {
            try {
                Object.entries(document.getElementsByTagName('iframe')).forEach( frame => {
                    let iframe2 = frame[1];

                    if(iframe2.src.includes('recaptcha/api2/bframe')) {
                        let parentDiv = iframe2.parentElement.parentElement;
                        parentDiv.style.top = '0px';
                        iframe2.style.transform = 'scale(0.75)';
                        iframe2.style.transformOrigin = 'top';
                    }
                });
            }
            catch (err) {
                console.error('[CAPTCHA] failed to align iframe');
            }

        }, 2000);
    }
</script>
<script src="https://www.recaptcha.net/recaptcha/api.js?render=explicit&onload=onloadCallback" async defer></script>
</body>
</html>
