<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foxtail Sports</title>
    <style>
      :root { color-scheme: light; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
        color: #111827;
      }

      /* ---------- loading screen ---------- */
      .loading {
        text-align: center;
      }

      .spinner {
        width: 40px;
        height: 40px;
        margin: 0 auto 16px;
        border: 4px solid #e5e7eb;
        border-top-color: #111827;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loading-text {
        font-size: 15px;
        color: #4b5563;
      }

      /* ---------- error card (hidden initially) ---------- */
      .card {
        display: none;
        width: min(460px, 100%);
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        box-shadow: 0 6px 24px rgba(15, 23, 42, 0.08);
        padding: 22px;
      }

      h1 { margin: 0 0 10px; font-size: 24px; line-height: 1.25; }
      p  { margin: 0 0 12px; color: #4b5563; line-height: 1.5; }

      .meta { margin-top: 8px; font-size: 13px; color: #6b7280; }

      .actions { display: flex; gap: 10px; margin-top: 18px; }

      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      #retry { background: #111827; color: #ffffff; }

      #status { margin-top: 14px; font-size: 13px; color: #6b7280; }
    </style>
  </head>
  <body>
    <!-- Phase 1: loading spinner (shown first) -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="loading-text" id="loading-text">Connecting to server...</div>
    </div>

    <!-- Phase 2: error card (shown after retries fail) -->
    <main class="card" id="error-card">
      <h1>Unable to connect</h1>
      <p>
        We couldn't reach the server right now. This is usually a temporary network issue.
      </p>
      <p>
        Tap retry to reconnect. The app will also retry automatically when your connection comes back.
      </p>

      <div class="actions">
        <button id="retry" type="button">Retry</button>
      </div>

      <div class="meta">Server: <span id="target"></span></div>
      <div id="status">Waiting for connection...</div>
    </main>

    <script>
      (function () {
        var loadingEl   = document.getElementById("loading");
        var loadingText = document.getElementById("loading-text");
        var errorCard   = document.getElementById("error-card");
        var statusEl    = document.getElementById("status");
        var targetEl    = document.getElementById("target");
        var retryBtn    = document.getElementById("retry");

        var MAX_AUTO_RETRIES = 2;
        var RETRY_DELAY_MS   = 2500;
        var attempt = 0;

        function setStatus(msg) { statusEl.textContent = msg; }

        // Use the native Java bridge injected by MainActivity to reload the
        // WebView with the configured server URL. This avoids the Android
        // WebView's shouldOverrideUrlLoading which would open the system
        // browser instead of staying in the app.
        function reloadApp() {
          if (window.FoxtailBridge && typeof window.FoxtailBridge.reload === "function") {
            window.FoxtailBridge.reload();
          } else {
            // Fallback: try Capacitor bridge or plain reload
            window.location.reload();
          }
        }

        function showError() {
          loadingEl.style.display = "none";
          errorCard.style.display = "block";
          setStatus("Waiting for connection...");
        }

        function autoRetry() {
          attempt++;
          loadingText.textContent = attempt === 1
            ? "Connecting to server..."
            : "Retrying (" + attempt + "/" + MAX_AUTO_RETRIES + ")...";

          if (attempt <= MAX_AUTO_RETRIES) {
            setTimeout(function () {
              reloadApp();
              // If we're still here after a short delay, the reload didn't
              // navigate away — server is probably still down. Try again or show error.
              setTimeout(function () {
                if (attempt < MAX_AUTO_RETRIES) {
                  autoRetry();
                } else {
                  showError();
                }
              }, 3000);
            }, RETRY_DELAY_MS);
          } else {
            showError();
          }
        }

        // Read capacitor.config.json just for the display URL
        function resolveDisplayUrl() {
          var paths = ["../capacitor.config.json", "../../capacitor.config.json"];
          function tryPath(i) {
            if (i >= paths.length) {
              targetEl.textContent = "configured server";
              return;
            }
            fetch(paths[i])
              .then(function (r) { return r.json(); })
              .then(function (cfg) {
                targetEl.textContent = (cfg && cfg.server && cfg.server.url) || "configured server";
              })
              .catch(function () { tryPath(i + 1); });
          }
          tryPath(0);
        }

        resolveDisplayUrl();

        // Start auto-retry sequence (shows spinner, retries 2x, then error card)
        autoRetry();

        // Manual retry button
        retryBtn.addEventListener("click", function () {
          errorCard.style.display = "none";
          loadingEl.style.display = "block";
          attempt = 0;
          autoRetry();
        });

        // Auto-retry when device comes back online
        window.addEventListener("online", function () {
          setStatus("Connection restored...");
          reloadApp();
        });

        // Periodic check every 10s while error card is visible
        setInterval(function () {
          if (errorCard.style.display === "block" && navigator.onLine) {
            setStatus("Checking connection...");
            reloadApp();
          }
        }, 10000);
      })();
    </script>
  </body>
</html>
