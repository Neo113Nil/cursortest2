<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Currency Converter</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07100d;
      --panel: rgba(13, 31, 25, 0.88);
      --panel-strong: rgba(18, 42, 34, 0.96);
      --line: rgba(228, 202, 129, 0.22);
      --gold: #f2cb72;
      --gold-strong: #ffe3a0;
      --mint: #75d7ad;
      --cream: #fff8e6;
      --muted: #abc1b6;
      --danger: #ff9f8d;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.4);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--cream);
      background:
        radial-gradient(circle at 18% 16%, rgba(117, 215, 173, 0.16), transparent 30%),
        linear-gradient(145deg, #05100c 0%, #0d201a 48%, #111610 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(120deg, transparent 0 18%, rgba(242, 203, 114, 0.1) 18% 18.5%, transparent 18.5% 100%),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 96px);
      opacity: 0.7;
    }

    main {
      position: relative;
      width: min(100%, 620px);
      min-height: 100vh;
      margin: 0 auto;
      padding: max(12px, env(safe-area-inset-top)) 14px max(12px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
    }

    .shell {
      width: 100%;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(12, 28, 23, 0.94), rgba(7, 16, 13, 0.9));
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(18px);
    }

    header {
      display: grid;
      gap: 6px;
      margin-bottom: 14px;
    }

    .mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(242, 203, 114, 0.48);
      border-radius: 8px;
      color: #07100d;
      background: linear-gradient(145deg, var(--gold-strong), var(--gold));
      box-shadow: 0 12px 28px rgba(242, 203, 114, 0.18);
      font-size: 22px;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 8vw, 42px);
      line-height: 1;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 42ch;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .converter {
      display: grid;
      gap: 10px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label,
    .group-label {
      color: var(--gold-strong);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      min-height: 48px;
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 8px;
      padding: 0 16px;
      color: var(--cream);
      background: rgba(255, 255, 255, 0.055);
      font-size: 19px;
      font-weight: 760;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    input:focus {
      border-color: rgba(242, 203, 114, 0.76);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 4px rgba(242, 203, 114, 0.12);
    }

    .direction {
      display: grid;
      gap: 8px;
    }

    .segments {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 5px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.055);
    }

    .segments input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .segments label {
      min-height: 40px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0;
      text-transform: none;
      cursor: pointer;
    }

    .segments input:checked + label {
      color: #06110d;
      background: linear-gradient(145deg, var(--gold-strong), var(--gold));
      box-shadow: 0 10px 22px rgba(242, 203, 114, 0.18);
    }

    .result {
      min-height: 92px;
      padding: 13px;
      border: 1px solid rgba(117, 215, 173, 0.3);
      border-radius: 8px;
      background: linear-gradient(160deg, rgba(117, 215, 173, 0.14), rgba(255, 255, 255, 0.04));
    }

    .result-label {
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .result-value {
      margin: 0;
      color: var(--cream);
      font-size: clamp(26px, 7.5vw, 38px);
      line-height: 1.05;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .hint {
      min-height: 18px;
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .hint.error {
      color: var(--danger);
    }

    .actions {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr;
      margin-top: 2px;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      padding: 0 16px;
      font: inherit;
      font-size: 15px;
      font-weight: 850;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease, border-color 120ms ease;
    }

    button:active {
      transform: translateY(1px);
    }

    .primary {
      color: #06110d;
      background: linear-gradient(145deg, var(--gold-strong), var(--gold));
      box-shadow: 0 14px 28px rgba(242, 203, 114, 0.18);
    }

    .secondary,
    .ghost {
      color: var(--cream);
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.07);
    }

    .ghost {
      color: var(--muted);
    }

    @media (min-width: 520px) {
      .shell {
        padding: 24px;
      }

      .actions {
        grid-template-columns: 1.15fr 1fr 0.75fr;
      }
    }

    @media (max-height: 720px) {
      main {
        padding: max(8px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom));
      }

      .shell {
        padding: 12px;
      }

      header {
        grid-template-columns: 34px 1fr;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }

      .mark {
        width: 34px;
        height: 34px;
        font-size: 18px;
      }

      h1 {
        font-size: 24px;
      }

      .subtitle {
        display: none;
      }

      .converter {
        gap: 8px;
      }

      .field,
      .direction {
        gap: 5px;
      }

      label,
      .group-label {
        font-size: 10px;
      }

      input {
        min-height: 40px;
        font-size: 17px;
      }

      .segments label {
        min-height: 34px;
        font-size: 12px;
      }

      .result {
        min-height: 76px;
        padding: 10px;
      }

      .result-label {
        font-size: 11px;
      }

      .result-value {
        font-size: 25px;
      }

      .hint {
        min-height: 15px;
        font-size: 11px;
      }

      .actions {
        grid-template-columns: 1fr 1fr 1fr;
        gap: 6px;
      }

      button {
        min-height: 38px;
        padding: 0 8px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="shell" aria-label="Currency calculator">
      <header>
        <div class="mark" aria-hidden="true">$</div>
        <h1>Currency Converter</h1>
        <p class="subtitle">Enter an amount, set your own exchange rate, choose a direction, and get the converted value instantly.</p>
      </header>

      <form class="converter" id="converter" novalidate>
        <div class="field">
          <label for="amount">Amount</label>
          <input id="amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="100.00" autocomplete="off">
        </div>

        <div class="field">
          <label for="rate">Exchange Rate</label>
          <input id="rate" type="number" min="0" step="0.0001" inputmode="decimal" placeholder="1.2500" autocomplete="off">
        </div>

        <div class="direction">
          <div class="group-label">Direction</div>
          <div class="segments" role="radiogroup" aria-label="Conversion direction">
            <input id="forward" name="direction" type="radio" value="forward" checked>
            <label for="forward">Base to Quote</label>
            <input id="reverse" name="direction" type="radio" value="reverse">
            <label for="reverse">Quote to Base</label>
          </div>
        </div>

        <div class="result" aria-live="polite">
          <p class="result-label" id="resultLabel">Converted Amount</p>
          <p class="result-value" id="resultValue">0.00</p>
          <p class="hint" id="hint">Use any currencies you like. The rate is fully custom.</p>
        </div>

        <div class="actions">
          <button class="primary" type="submit">Calculate</button>
          <button class="secondary" type="button" id="swap">Swap Currencies</button>
          <button class="ghost" type="button" id="clear">Clear</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    const amountInput = document.getElementById("amount");
    const rateInput = document.getElementById("rate");
    const resultValue = document.getElementById("resultValue");
    const resultLabel = document.getElementById("resultLabel");
    const hint = document.getElementById("hint");
    const converter = document.getElementById("converter");
    const swapButton = document.getElementById("swap");
    const clearButton = document.getElementById("clear");

    function selectedDirection() {
      return document.querySelector("input[name='direction']:checked").value;
    }

    function setMessage(message, isError = false) {
      hint.textContent = message;
      hint.classList.toggle("error", isError);
    }

    function formatNumber(value) {
      return new Intl.NumberFormat("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 6
      }).format(value);
    }

    function calculate() {
      const amount = Number(amountInput.value);
      const rate = Number(rateInput.value);

      if (!Number.isFinite(amount) || amount <= 0) {
        resultValue.textContent = "0.00";
        setMessage("Enter an amount greater than zero.", true);
        amountInput.focus();
        return;
      }

      if (!Number.isFinite(rate) || rate <= 0) {
        resultValue.textContent = "0.00";
        setMessage("Enter an exchange rate greater than zero.", true);
        rateInput.focus();
        return;
      }

      const forward = selectedDirection() === "forward";
      const result = forward ? amount * rate : amount / rate;
      resultLabel.textContent = forward ? "Base to Quote Result" : "Quote to Base Result";
      resultValue.textContent = formatNumber(result);
      setMessage(`Calculated with a custom rate of ${formatNumber(rate)}.`);
    }

    converter.addEventListener("submit", (event) => {
      event.preventDefault();
      calculate();
    });

    swapButton.addEventListener("click", () => {
      const forward = document.getElementById("forward");
      const reverse = document.getElementById("reverse");
      forward.checked = !forward.checked;
      reverse.checked = !reverse.checked;
      setMessage("Conversion direction swapped.");
      if (amountInput.value && rateInput.value) {
        calculate();
      }
    });

    clearButton.addEventListener("click", () => {
      amountInput.value = "";
      rateInput.value = "";
      document.getElementById("forward").checked = true;
      resultLabel.textContent = "Converted Amount";
      resultValue.textContent = "0.00";
      setMessage("Use any currencies you like. The rate is fully custom.");
      amountInput.focus();
    });
  </script>
</body>
</html>
