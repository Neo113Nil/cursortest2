<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Coin Flip</title>
  <style>
    :root {
      --ink: #17202a;
      --muted: #6d7887;
      --panel: rgba(255, 255, 255, 0.82);
      --panel-strong: rgba(255, 255, 255, 0.96);
      --gold: #f4bf45;
      --gold-dark: #a96812;
      --teal: #1fb6a6;
      --rose: #e76f7a;
      --shadow: 0 24px 60px rgba(22, 31, 45, 0.18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 12%, rgba(255, 255, 255, 0.95) 0 16%, transparent 30%),
        linear-gradient(150deg, #c8fff2 0%, #ffe08a 40%, #ffb1ad 100%);
    }

    body {
      display: grid;
      place-items: center;
      overflow-x: hidden;
      padding: max(22px, env(safe-area-inset-top)) 18px max(22px, env(safe-area-inset-bottom));
    }

    .game {
      width: min(440px, 100%);
      min-height: min(760px, calc(100vh - 36px));
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 18px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.62);
      border-radius: 28px;
      background: linear-gradient(180deg, var(--panel-strong), var(--panel));
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    h1 {
      margin: 0;
      font-size: 2.2rem;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0;
    }

    .badge {
      min-width: 84px;
      padding: 9px 12px;
      border-radius: 999px;
      background: #182331;
      color: white;
      font-size: 0.78rem;
      font-weight: 800;
      text-align: center;
      text-transform: uppercase;
    }

    .stage {
      display: grid;
      place-items: center;
      gap: 18px;
      align-content: center;
      padding: 10px 0;
      perspective: 900px;
    }

    .coin-wrap {
      width: min(68vw, 258px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 28px 24px rgba(117, 73, 12, 0.28));
    }

    .coin {
      --spin-start: 0deg;
      --spin-end: 0deg;
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      transform-style: preserve-3d;
      transform: rotateY(var(--spin-end));
    }

    .coin.flipping {
      animation: flip 860ms cubic-bezier(0.2, 0.75, 0.15, 1) forwards;
    }

    .side {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      backface-visibility: hidden;
      border: 9px solid rgba(255, 255, 255, 0.55);
      background:
        radial-gradient(circle at 35% 28%, #fff6b8 0 12%, transparent 25%),
        radial-gradient(circle at center, #ffd96a 0 55%, #d89322 57% 100%);
      box-shadow:
        inset 0 -18px 30px rgba(126, 72, 6, 0.28),
        inset 0 16px 28px rgba(255, 255, 255, 0.56);
    }

    .side::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 4px dashed rgba(143, 89, 15, 0.42);
      border-radius: 50%;
    }

    .tails {
      transform: rotateY(180deg);
      background:
        radial-gradient(circle at 35% 28%, #fff8ce 0 12%, transparent 25%),
        radial-gradient(circle at center, #f6c557 0 55%, #bd7118 57% 100%);
    }

    .symbol {
      z-index: 1;
      width: 48%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.32);
      border: 2px solid rgba(135, 82, 12, 0.2);
      color: var(--gold-dark);
      font-size: clamp(3.5rem, 16vw, 5.4rem);
      font-weight: 950;
      text-shadow: 0 3px rgba(255, 255, 255, 0.58);
    }

    .result {
      min-height: 74px;
      display: grid;
      place-items: center;
      gap: 5px;
      text-align: center;
    }

    .result small {
      color: var(--muted);
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .result strong {
      font-size: clamp(2.1rem, 10vw, 3.2rem);
      line-height: 1;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat {
      padding: 16px 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.74);
      text-align: center;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .stat strong {
      display: block;
      margin-top: 6px;
      font-size: 2rem;
      line-height: 1;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    button {
      min-height: 58px;
      border: 0;
      border-radius: 18px;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }

    .flip-btn {
      color: #fff;
      background: linear-gradient(135deg, #182331, #35465b);
      box-shadow: 0 14px 30px rgba(24, 35, 49, 0.24);
    }

    .reset-btn {
      width: 58px;
      color: #2d3948;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.78);
      font-size: 1.25rem;
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.72;
      cursor: wait;
    }

    @keyframes flip {
      0% {
        transform: rotateY(var(--spin-start)) translateY(0) scale(1);
      }
      42% {
        transform: rotateY(calc(var(--spin-start) + 900deg)) translateY(-22px) scale(1.04);
      }
      100% {
        transform: rotateY(var(--spin-end)) translateY(0) scale(1);
      }
    }

    @media (max-height: 680px) {
      .game {
        gap: 12px;
        padding: 18px;
      }

      .coin-wrap {
        width: min(54vw, 210px);
      }

      h1 {
        font-size: 1.9rem;
      }
    }
  </style>
</head>
<body>
  <main class="game" aria-label="Coin flip game">
    <header>
      <h1>Coin Flip</h1>
      <div class="badge" id="totalBadge">0 flips</div>
    </header>

    <section class="stage">
      <div class="coin-wrap" aria-live="polite">
        <div class="coin" id="coin">
          <div class="side heads">
            <div class="symbol">H</div>
          </div>
          <div class="side tails">
            <div class="symbol">T</div>
          </div>
        </div>
      </div>

      <div class="result">
        <small>Result</small>
        <strong id="resultText">Ready?</strong>
      </div>
    </section>

    <section class="stats" aria-label="Flip statistics">
      <div class="stat">
        <span>Heads</span>
        <strong id="headsCount">0</strong>
      </div>
      <div class="stat">
        <span>Tails</span>
        <strong id="tailsCount">0</strong>
      </div>
    </section>

    <section class="controls">
      <button class="flip-btn" id="flipButton" type="button">Flip</button>
      <button class="reset-btn" id="resetButton" type="button" aria-label="Reset statistics" title="Reset statistics">↺</button>
    </section>
  </main>

  <script>
    const coin = document.getElementById("coin");
    const resultText = document.getElementById("resultText");
    const flipButton = document.getElementById("flipButton");
    const resetButton = document.getElementById("resetButton");
    const headsCount = document.getElementById("headsCount");
    const tailsCount = document.getElementById("tailsCount");
    const totalBadge = document.getElementById("totalBadge");

    const stats = {
      heads: 0,
      tails: 0,
      rotation: 0
    };

    function renderStats() {
      const total = stats.heads + stats.tails;
      headsCount.textContent = stats.heads;
      tailsCount.textContent = stats.tails;
      totalBadge.textContent = `${total} ${total === 1 ? "flip" : "flips"}`;
    }

    function flipCoin() {
      flipButton.disabled = true;
      resultText.textContent = "Flipping...";

      const isHeads = Math.random() < 0.5;
      const result = isHeads ? "Heads" : "Tails";
      const targetFace = isHeads ? 0 : 180;
      let endRotation = stats.rotation + 1800;
      if (endRotation % 360 !== targetFace) {
        endRotation += 180;
      }

      coin.classList.remove("flipping");
      coin.style.setProperty("--spin-start", `${stats.rotation}deg`);
      coin.style.setProperty("--spin-end", `${endRotation}deg`);

      requestAnimationFrame(() => {
        coin.classList.add("flipping");
      });

      window.setTimeout(() => {
        stats.rotation = endRotation;
        if (isHeads) {
          stats.heads += 1;
        } else {
          stats.tails += 1;
        }
        resultText.textContent = result;
        renderStats();
        coin.classList.remove("flipping");
        flipButton.disabled = false;
      }, 880);
    }

    function resetStats() {
      stats.heads = 0;
      stats.tails = 0;
      stats.rotation = 0;
      coin.classList.remove("flipping");
      coin.style.setProperty("--spin-start", "0deg");
      coin.style.setProperty("--spin-end", "0deg");
      resultText.textContent = "Ready?";
      renderStats();
    }

    flipButton.addEventListener("click", flipCoin);
    resetButton.addEventListener("click", resetStats);
    renderStats();
  </script>
</body>
</html>
