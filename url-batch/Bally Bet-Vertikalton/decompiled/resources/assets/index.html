<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Win Sky</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#030812;color:#e8f4ff;touch-action:none;user-select:none}
#neonBg{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,#030812 0%,#0a0820 45%,#12082a 100%);overflow:hidden}
#neonBg::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 18% 22%,rgba(0,243,255,0.14) 0%,transparent 42%),radial-gradient(circle at 82% 18%,rgba(176,38,255,0.16) 0%,transparent 38%),radial-gradient(circle at 72% 78%,rgba(255,140,0,0.09) 0%,transparent 32%),radial-gradient(circle at 28% 72%,rgba(0,200,180,0.11) 0%,transparent 36%),radial-gradient(circle at 50% 50%,rgba(124,77,255,0.06) 0%,transparent 55%)}
#neonBg::after{content:"";position:absolute;left:0;right:0;bottom:0;height:35%;background:linear-gradient(0deg,rgba(176,38,255,0.12) 0%,transparent 100%);opacity:0.7}
.bk-dot{position:absolute;border-radius:50%;filter:blur(12px);animation:bkFloat 8s ease-in-out infinite alternate}
@keyframes bkFloat{0%{transform:translateY(0) scale(1)}100%{transform:translateY(-18px) scale(1.08)}}
#app{position:fixed;inset:0;width:100%;height:100%;z-index:1}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.active{display:flex}
#gameScreen{display:none;position:absolute;inset:0}
#gameScreen.active{display:block}
#gameCanvas{display:block;width:100%;height:100%;touch-action:none}
.panel{background:rgba(5,8,24,0.82);border:2px solid rgba(0,243,255,0.35);border-radius:20px;padding:32px 28px;width:min(92vw,380px);text-align:center;box-shadow:0 0 24px rgba(176,38,255,0.28),0 0 48px rgba(0,243,255,0.12),inset 0 0 32px rgba(0,243,255,0.04);backdrop-filter:blur(8px)}
.panel-title{font-size:2.6rem;font-weight:800;color:#7ef9ff;line-height:1.1;margin-bottom:6px;text-shadow:0 0 6px #fff,0 0 12px #00f3ff,0 0 24px #00f3ff,0 0 48px #b026ff,0 0 72px rgba(176,38,255,0.6);letter-spacing:0.02em}
.panel-sub{font-size:1.35rem;font-weight:800;font-style:italic;color:#c77dff;margin-bottom:24px;text-shadow:0 0 8px #b026ff,0 0 20px rgba(176,38,255,0.5),0 0 4px #fff}
.panel-stat{font-size:1.05rem;font-weight:700;color:#b8e4ff;margin-bottom:20px;background:rgba(0,243,255,0.06);padding:12px 16px;border-radius:12px;border:1px solid rgba(0,243,255,0.18);box-shadow:inset 0 0 16px rgba(176,38,255,0.08)}
.btn{display:block;width:100%;min-height:52px;padding:14px 20px;margin-top:12px;border:none;border-radius:14px;font-size:1.15rem;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(180deg,#00e5ff,#7c4dff);box-shadow:0 0 22px rgba(0,229,255,0.45),0 0 36px rgba(124,77,255,0.35),0 4px 16px rgba(0,0,0,0.4);text-shadow:0 0 8px rgba(255,255,255,0.4)}
.btn:active{transform:scale(0.97);opacity:0.92}
.btn-secondary{background:linear-gradient(180deg,rgba(90,60,140,0.9),rgba(40,30,70,0.95));box-shadow:0 0 16px rgba(176,38,255,0.25),0 4px 16px rgba(0,0,0,0.35);border:1px solid rgba(176,38,255,0.3)}
#hud{position:absolute;top:0;left:0;right:0;padding:40px 16px 16px;display:none;pointer-events:none;z-index:10}
#hud.active{display:flex;justify-content:space-between;gap:12px}
.hud-box{background:rgba(5,8,24,0.78);border:2px solid rgba(0,243,255,0.35);border-radius:12px;padding:10px 16px;font-size:1rem;font-weight:700;color:#7ef9ff;min-width:100px;text-align:center;box-shadow:0 0 16px rgba(0,243,255,0.2),0 0 24px rgba(176,38,255,0.15)}
.hud-label{font-size:0.75rem;font-weight:700;color:#c77dff;display:block;margin-bottom:2px;text-shadow:0 0 6px rgba(176,38,255,0.5)}
.hud-value{font-size:1.25rem;font-weight:800;color:#fff;text-shadow:0 0 10px #00f3ff,0 0 20px rgba(0,243,255,0.4)}
#resultNew{font-size:1.2rem;font-weight:800;color:#ffb347;margin-bottom:12px;display:none;text-shadow:0 0 8px #ffb347,0 0 20px rgba(255,179,71,0.6),0 0 4px #fff}
#resultNew.show{display:block}
</style>
</head>
<body>
<div id="neonBg"></div>
<div id="app">
<div id="menuScreen" class="screen active">
<div class="panel">
<div class="panel-title">Win</div>
<div class="panel-sub">Sky Fall</div>
<div class="panel-stat">Best Score: <span id="menuBest">0</span></div>
<div class="panel-stat">Round Goal: <span id="menuGoal">60</span> rings</div>
<button class="btn" id="btnPlay">Play</button>
</div>
</div>
<div id="gameScreen">
<canvas id="gameCanvas"></canvas>
<div id="hud">
<div class="hud-box"><span class="hud-label">SCORE</span><span class="hud-value" id="hudScore">0</span></div>
<div class="hud-box"><span class="hud-label">GOAL</span><span class="hud-value" id="hudGoal">0 / 60</span></div>
</div>
</div>
<div id="resultScreen" class="screen">
<div class="panel">
<div class="panel-title" id="resultTitle">Round Over</div>
<div id="resultNew">New Best!</div>
<div class="panel-stat">Score: <span id="resultScore">0</span></div>
<div class="panel-stat">Rings Passed: <span id="resultRings">0</span></div>
<button class="btn" id="btnAgain">Play Again</button>
<button class="btn btn-secondary" id="btnMenu">Menu</button>
</div>
</div>
</div>
<script>
(function(){
var LS_KEY="wsky_best";
var menuScreen=document.getElementById("menuScreen");
var gameScreen=document.getElementById("gameScreen");
var resultScreen=document.getElementById("resultScreen");
var canvas=document.getElementById("gameCanvas");
var ctx=canvas.getContext("2d");
var hud=document.getElementById("hud");
var hudScore=document.getElementById("hudScore");
var hudGoal=document.getElementById("hudGoal");
var menuBest=document.getElementById("menuBest");
var resultScore=document.getElementById("resultScore");
var resultRings=document.getElementById("resultRings");
var resultNew=document.getElementById("resultNew");
var resultTitle=document.getElementById("resultTitle");
var ROUND_GOAL=60;
var W=0,H=0,dpr=1;
var state="menu";
var rafId=0;
var lastTime=0;
var score=0;
var ringsPassed=0;
var bestScore=0;
var player={x:0,y:0,vx:0,r:14};
var ringSpeed=180;
var rings=[];
var spawnTimer=0;
var spawnInterval=1.8;
var difficulty=0;
var bokeh=[];
var sparks=[];
var glitter=[];
var bgTime=0;
var touchLeft=false;
var touchRight=false;
function loadBest(){
try{bestScore=parseInt(localStorage.getItem(LS_KEY)||"0",10)||0}catch(e){bestScore=0}
menuBest.textContent=bestScore;
}
function saveBest(v){
try{localStorage.setItem(LS_KEY,String(v))}catch(e){}
bestScore=v;
menuBest.textContent=v;
}
function resize(){
dpr=Math.min(window.devicePixelRatio||1,2);
W=window.innerWidth;
H=window.innerHeight;
canvas.width=Math.floor(W*dpr);
canvas.height=Math.floor(H*dpr);
canvas.style.width=W+"px";
canvas.style.height=H+"px";
ctx.setTransform(dpr,0,0,dpr,0,0);
}
function showScreen(name){
state=name;
menuScreen.classList.toggle("active",name==="menu");
gameScreen.classList.toggle("active",name==="game");
resultScreen.classList.toggle("active",name==="result");
hud.classList.toggle("active",name==="game");
}
function initBokeh(){
bokeh=[];
var cols=["0,243,255","176,38,255","255,140,0","0,200,180","124,77,255"];
for(var i=0;i<28;i++){
bokeh.push({x:Math.random()*W,y:Math.random()*H,r:10+Math.random()*45,a:0.06+Math.random()*0.14,col:cols[Math.floor(Math.random()*cols.length)],s:0.02+Math.random()*0.06});
}
sparks=[];
for(var j=0;j<40;j++){
sparks.push({x:Math.random()*W,y:Math.random()*H,len:5+Math.random()*14,ang:Math.random()*Math.PI*2,a:0.25+Math.random()*0.55,warm:Math.random()>0.45});
}
glitter=[];
for(var k=0;k<60;k++){
glitter.push({x:Math.random()*W,y:H*0.72+Math.random()*H*0.28,s:1+Math.random()*2.5,a:0.2+Math.random()*0.6,col:Math.random()>0.5?"176,38,255":"0,243,255"});
}
}
function initNeonBgDots(){
var bg=document.getElementById("neonBg");
var old=bg.querySelectorAll(".bk-dot");
for(var i=0;i<old.length;i++)old[i].remove();
var cols=["rgba(0,243,255,0.18)","rgba(176,38,255,0.2)","rgba(255,140,0,0.12)","rgba(0,200,180,0.14)"];
for(var j=0;j<14;j++){
var d=document.createElement("div");
d.className="bk-dot";
var sz=30+Math.random()*70;
d.style.width=sz+"px";
d.style.height=sz+"px";
d.style.left=(Math.random()*100)+"%";
d.style.top=(Math.random()*100)+"%";
d.style.background=cols[Math.floor(Math.random()*cols.length)];
d.style.animationDelay=(Math.random()*6)+"s";
d.style.animationDuration=(6+Math.random()*6)+"s";
bg.appendChild(d);
}
}
function drawSky(){
bgTime+=0.016;
var grd=ctx.createLinearGradient(0,0,0,H);
grd.addColorStop(0,"#030812");
grd.addColorStop(0.55,"#0a0820");
grd.addColorStop(1,"#12082a");
ctx.fillStyle=grd;
ctx.fillRect(0,0,W,H);
for(var i=0;i<bokeh.length;i++){
var b=bokeh[i];
b.y+=b.s*28;
if(b.y>H+b.r){b.y=-b.r;b.x=Math.random()*W}
var g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
g.addColorStop(0,"rgba("+b.col+","+b.a+")");
g.addColorStop(1,"rgba("+b.col+",0)");
ctx.fillStyle=g;
ctx.beginPath();
ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
ctx.fill();
}
for(var j=0;j<sparks.length;j++){
var sp=sparks[j];
sp.x+=Math.cos(sp.ang)*0.3;
sp.y+=Math.sin(sp.ang)*0.3;
if(sp.x<0||sp.x>W||sp.y<0||sp.y>H){sp.x=Math.random()*W;sp.y=Math.random()*H*0.7;sp.ang=Math.random()*Math.PI*2}
ctx.strokeStyle=sp.warm?"rgba(255,179,71,"+sp.a+")":"rgba(0,243,255,"+sp.a+")";
ctx.lineWidth=1.2;
ctx.beginPath();
ctx.moveTo(sp.x,sp.y);
ctx.lineTo(sp.x+Math.cos(sp.ang)*sp.len,sp.y+Math.sin(sp.ang)*sp.len);
ctx.stroke();
}
var floorGrd=ctx.createLinearGradient(0,H*0.68,0,H);
floorGrd.addColorStop(0,"rgba(176,38,255,0)");
floorGrd.addColorStop(1,"rgba(176,38,255,0.18)");
ctx.fillStyle=floorGrd;
ctx.fillRect(0,H*0.68,W,H*0.32);
for(var k=0;k<glitter.length;k++){
var gl=glitter[k];
gl.x+=Math.sin(bgTime+k)*0.15;
var ga=gl.a*(0.6+0.4*Math.sin(bgTime*2+k));
ctx.fillStyle="rgba("+gl.col+","+ga+")";
ctx.beginPath();
ctx.arc(gl.x,gl.y,gl.s,0,Math.PI*2);
ctx.fill();
}
}
function drawPlayer(px,py){
ctx.save();
var pulse=0.85+0.15*Math.sin(bgTime*8);
var thrH=14+6*pulse;
var thrG=ctx.createLinearGradient(px,py+10,px,py+10+thrH);
thrG.addColorStop(0,"rgba(0,243,255,0.95)");
thrG.addColorStop(0.45,"rgba(176,38,255,0.75)");
thrG.addColorStop(1,"rgba(176,38,255,0)");
ctx.fillStyle=thrG;
ctx.beginPath();
ctx.moveTo(px-5,py+10);
ctx.lineTo(px,py+10+thrH);
ctx.lineTo(px+5,py+10);
ctx.closePath();
ctx.fill();
ctx.shadowBlur=18;
ctx.shadowColor="#00f3ff";
ctx.fillStyle="rgba(0,243,255,0.35)";
ctx.beginPath();
ctx.ellipse(px,py+8,7,4,0,0,Math.PI*2);
ctx.fill();
ctx.shadowBlur=0;
ctx.fillStyle="rgba(124,77,255,0.55)";
ctx.beginPath();
ctx.moveTo(px-20,py+2);
ctx.lineTo(px-10,py-6);
ctx.lineTo(px-10,py+8);
ctx.closePath();
ctx.fill();
ctx.beginPath();
ctx.moveTo(px+20,py+2);
ctx.lineTo(px+10,py-6);
ctx.lineTo(px+10,py+8);
ctx.closePath();
ctx.fill();
var bodyG=ctx.createLinearGradient(px,py-16,px,py+12);
bodyG.addColorStop(0,"#b8f8ff");
bodyG.addColorStop(0.5,"#00e5ff");
bodyG.addColorStop(1,"#7c4dff");
ctx.shadowBlur=22;
ctx.shadowColor="#00f3ff";
ctx.fillStyle=bodyG;
ctx.beginPath();
ctx.moveTo(px-11+11,py-14);
ctx.lineTo(px+11-11,py-14);
ctx.quadraticCurveTo(px+11,py-14,px+11,py-14+11);
ctx.lineTo(px+11,py+12-11);
ctx.quadraticCurveTo(px+11,py+12,px+11-11,py+12);
ctx.lineTo(px-11+11,py+12);
ctx.quadraticCurveTo(px-11,py+12,px-11,py+12-11);
ctx.lineTo(px-11,py-14+11);
ctx.quadraticCurveTo(px-11,py-14,px-11+11,py-14);
ctx.closePath();
ctx.fill();
ctx.shadowBlur=0;
ctx.fillStyle="rgba(8,12,32,0.85)";
ctx.beginPath();
ctx.ellipse(px,py-6,7,5,0,0,Math.PI*2);
ctx.fill();
ctx.fillStyle="rgba(0,243,255,0.9)";
ctx.beginPath();
ctx.ellipse(px,py-6,5,3.5,0,0,Math.PI);
ctx.fill();
ctx.strokeStyle="rgba(255,255,255,0.45)";
ctx.lineWidth=1.5;
ctx.beginPath();
ctx.arc(px,py-6,7,Math.PI*1.15,Math.PI*1.85);
ctx.stroke();
ctx.fillStyle="#ffb347";
ctx.shadowBlur=10;
ctx.shadowColor="#ffb347";
ctx.beginPath();
ctx.arc(px-4,py-8,1.8,0,Math.PI*2);
ctx.arc(px+4,py-8,1.8,0,Math.PI*2);
ctx.fill();
ctx.shadowBlur=14;
ctx.shadowColor="#00f3ff";
ctx.strokeStyle="rgba(126,249,255,0.7)";
ctx.lineWidth=2;
ctx.beginPath();
ctx.arc(px,py+2,13,0,Math.PI*2);
ctx.stroke();
ctx.restore();
}
function spawnRing(){
var margin=60;
var rx=margin+Math.random()*(W-margin*2);
rings.push({x:rx,y:H+80,outerR:52,innerR:34,passed:false,scored:false,missed:false});
}
function drawRing(r){
ctx.save();
ctx.shadowBlur=22;
ctx.shadowColor="#00f3ff";
ctx.strokeStyle="#00f3ff";
ctx.lineWidth=7;
ctx.beginPath();
ctx.arc(r.x,r.y,r.outerR,0,Math.PI*2);
ctx.stroke();
ctx.shadowBlur=18;
ctx.shadowColor="#b026ff";
ctx.strokeStyle="#c77dff";
ctx.lineWidth=4;
ctx.beginPath();
ctx.arc(r.x,r.y,r.innerR,0,Math.PI*2);
ctx.stroke();
ctx.shadowBlur=10;
ctx.shadowColor="#7ef9ff";
ctx.strokeStyle="rgba(126,249,255,0.55)";
ctx.lineWidth=2;
ctx.beginPath();
ctx.arc(r.x,r.y,(r.outerR+r.innerR)/2,0,Math.PI*2);
ctx.stroke();
ctx.restore();
}
function resetGame(){
score=0;
ringsPassed=0;
rings=[];
spawnTimer=0;
spawnInterval=1.8;
difficulty=0;
ringSpeed=180;
player.x=W/2;
player.y=H*0.58;
player.vx=0;
hudScore.textContent="0";
hudGoal.textContent="0 / "+ROUND_GOAL;
initBokeh();
}
function startGame(){
resetGame();
showScreen("game");
lastTime=performance.now();
if(rafId)cancelAnimationFrame(rafId);
rafId=requestAnimationFrame(loop);
}
function endGame(won){
cancelAnimationFrame(rafId);
rafId=0;
var isNew=score>bestScore;
if(isNew)saveBest(score);
resultTitle.textContent=won?"Round Complete!":"Round Over";
resultScore.textContent=score;
resultRings.textContent=ringsPassed;
resultNew.classList.toggle("show",isNew);
showScreen("result");
}
function checkCollisions(){
for(var i=0;i<rings.length;i++){
var r=rings[i];
var dx=player.x-r.x;
var dy=player.y-r.y;
var dist=Math.sqrt(dx*dx+dy*dy);
if(!r.scored&&r.y>player.y-40&&r.y<player.y+20){
if(dist<r.innerR-4){
r.scored=true;
r.passed=true;
ringsPassed++;
score+=100;
hudScore.textContent=score;
hudGoal.textContent=ringsPassed+" / "+ROUND_GOAL;
difficulty+=1;
ringSpeed=Math.min(320,180+difficulty*4);
spawnInterval=Math.max(0.9,1.8-difficulty*0.04);
if(ringsPassed>=ROUND_GOAL){
endGame(true);
return;
}
}else if(dist<r.outerR+player.r){
endGame(false);
return;
}
}
if(!r.missed&&r.y<player.y-80&&!r.scored){
r.missed=true;
}
}
}
function update(dt){
if(touchLeft&&!touchRight)player.vx-=520*dt;
else if(touchRight&&!touchLeft)player.vx+=520*dt;
player.vx*=0.92;
player.x+=player.vx*dt;
if(player.x<player.r+10)player.x=player.r+10;
if(player.x>W-player.r-10)player.x=W-player.r-10;
for(var i=0;i<rings.length;i++)rings[i].y-=ringSpeed*dt;
rings=rings.filter(function(r){return r.y>-100});
spawnTimer+=dt;
if(spawnTimer>=spawnInterval){
spawnTimer=0;
spawnRing();
}
checkCollisions();
}
function render(){
drawSky();
for(var i=0;i<rings.length;i++)drawRing(rings[i]);
drawPlayer(player.x,player.y);
}
function loop(now){
if(state!=="game")return;
var dt=Math.min((now-lastTime)/1000,0.05);
lastTime=now;
update(dt);
render();
rafId=requestAnimationFrame(loop);
}
function handleTouchStart(e){
e.preventDefault();
var t=e.touches[0];
if(!t)return;
var x=t.clientX;
touchLeft=x<W/2;
touchRight=x>=W/2;
}
function handleTouchMove(e){
e.preventDefault();
var t=e.touches[0];
if(!t)return;
var x=t.clientX;
touchLeft=x<W/2;
touchRight=x>=W/2;
}
function handleTouchEnd(e){
e.preventDefault();
touchLeft=false;
touchRight=false;
}
document.getElementById("btnPlay").addEventListener("click",function(){startGame()});
document.getElementById("btnAgain").addEventListener("click",function(){startGame()});
document.getElementById("btnMenu").addEventListener("click",function(){showScreen("menu")});
canvas.addEventListener("touchstart",handleTouchStart,{passive:false});
canvas.addEventListener("touchmove",handleTouchMove,{passive:false});
canvas.addEventListener("touchend",handleTouchEnd,{passive:false});
canvas.addEventListener("touchcancel",handleTouchEnd,{passive:false});
window.addEventListener("resize",function(){resize();if(state==="game"){player.x=Math.min(Math.max(player.x,player.r+10),W-player.r-10);initBokeh()}else{initBokeh()}});
document.getElementById("menuGoal").textContent=ROUND_GOAL;
loadBest();
resize();
initBokeh();
initNeonBgDots();
})();
</script>
</body>
</html>
