<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fortune Tiles</title>
  <style>
    :root {
      --ink: #fff9ef;
      --muted: rgba(255, 249, 239, .72);
      --gold: #ffd979;
      --rose: #ff75a8;
      --teal: #48f1d5;
      --violet: #7e62ff;
      --panel: rgba(22, 18, 45, .54);
      --panel-strong: rgba(255, 255, 255, .14);
      --line: rgba(255, 255, 255, .2);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #100d25;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 16% 15%, rgba(255, 217, 121, .42), transparent 24%),
        radial-gradient(circle at 84% 10%, rgba(72, 241, 213, .32), transparent 25%),
        radial-gradient(circle at 52% 84%, rgba(255, 117, 168, .36), transparent 30%),
        linear-gradient(145deg, #120d2c 0%, #2b1454 41%, #111c42 70%, #103233 100%);
    }

    .game {
      width: min(100vw, 520px);
      max-width: 100vw;
      height: 100svh;
      padding: max(14px, env(safe-area-inset-top)) 14px max(12px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 10px;
      position: relative;
    }

    .game::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 26px;
      pointer-events: none;
      box-shadow: inset 0 0 70px rgba(255, 255, 255, .05);
    }

    .stats,
    .footer,
    .screen {
      position: relative;
      z-index: 1;
    }

    button {
      border: 0;
      min-height: 44px;
      border-radius: 999px;
      padding: 0 16px;
      color: #1a1235;
      background: linear-gradient(135deg, #fff3b3, #ffc95b 44%, #ff7da9 100%);
      font-weight: 900;
      box-shadow: 0 12px 28px rgba(255, 159, 88, .28);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .stat {
      min-height: 58px;
      padding: 8px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: 0 14px 34px rgba(0, 0, 0, .18);
      display: grid;
      align-content: center;
      gap: 3px;
    }

    .label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .value {
      font-size: 20px;
      font-weight: 900;
    }

    .board-wrap {
      min-height: 0;
      height: 100%;
      width: 100%;
      display: grid;
      align-items: center;
      justify-items: stretch;
      position: relative;
      z-index: 1;
    }

    .board {
      width: calc(100vw - 48px);
      max-width: 430px;
      max-height: calc(100svh - 148px);
      aspect-ratio: 4 / 5;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: repeat(5, minmax(0, 1fr));
      gap: clamp(7px, 2vw, 10px);
      justify-self: center;
    }

    .tile {
      position: relative;
      border: 1px solid rgba(255, 255, 255, .24);
      border-radius: 8px;
      background: transparent;
      padding: 0;
      min-height: 0;
      box-shadow: 0 16px 28px rgba(0, 0, 0, .22);
      transform-style: preserve-3d;
      transition: transform .38s cubic-bezier(.2, .8, .2, 1), opacity .28s ease;
    }

    .tile.revealed,
    .tile.matched {
      transform: rotateY(180deg);
    }

    .tile.matched {
      opacity: 1;
      pointer-events: none;
      border-color: rgba(255, 217, 121, .72);
      box-shadow: 0 14px 26px rgba(255, 217, 121, .24);
    }

    .face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: 8px;
      backface-visibility: hidden;
      overflow: hidden;
    }

    .back {
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .28), rgba(255, 255, 255, .08)),
        linear-gradient(145deg, #5834ff, #d94fa3 58%, #ffd66e);
    }

    .back::after {
      content: "";
      width: 46%;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .58);
      box-shadow: 0 0 0 8px rgba(255, 255, 255, .08), inset 0 0 18px rgba(255, 255, 255, .24);
    }

    .front {
      transform: rotateY(180deg);
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .92), rgba(255, 243, 205, .76)),
        var(--tile-glow);
      color: #23173e;
      font-size: clamp(30px, 9vw, 44px);
      text-shadow: 0 2px 0 rgba(255, 255, 255, .5);
    }

    .footer {
      min-height: 44px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      text-align: left;
    }

    .footer button {
      min-width: 100px;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: max(26px, env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(120%);
      width: min(calc(100% - 44px), 420px);
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, .24);
      border-radius: 8px;
      background: rgba(18, 14, 39, .84);
      backdrop-filter: blur(20px);
      text-align: center;
      font-weight: 850;
      opacity: 0;
      transition: transform .28s ease, opacity .28s ease;
      z-index: 4;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .screen {
      position: absolute;
      inset: max(14px, env(safe-area-inset-top)) 14px max(12px, env(safe-area-inset-bottom));
      display: grid;
      place-items: center;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 26px;
      background:
        radial-gradient(circle at 20% 10%, rgba(255, 217, 121, .26), transparent 28%),
        radial-gradient(circle at 78% 84%, rgba(72, 241, 213, .18), transparent 30%),
        rgba(14, 11, 32, .88);
      backdrop-filter: blur(24px);
      opacity: 0;
      pointer-events: none;
      transform: scale(.98);
      transition: opacity .24s ease, transform .24s ease;
      z-index: 5;
    }

    .screen.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .menu-card {
      width: min(100%, 400px);
      display: grid;
      gap: 16px;
      text-align: center;
    }

    .menu-kicker {
      color: var(--teal);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .menu-title {
      margin: 0;
      color: var(--ink);
      font-size: clamp(38px, 12vw, 58px);
      line-height: .9;
      letter-spacing: -.06em;
      text-shadow: 0 10px 34px rgba(255, 117, 168, .34);
    }

    .menu-text {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
      font-weight: 700;
    }

    .menu-actions {
      display: grid;
      gap: 10px;
    }

    .menu-actions button {
      width: 100%;
      min-height: 52px;
      font-size: 15px;
    }

    .ghost-button {
      color: var(--ink);
      background: rgba(255, 255, 255, .12);
      border: 1px solid rgba(255, 255, 255, .22);
      box-shadow: none;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .result-item {
      min-height: 72px;
      padding: 10px 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, .1);
      display: grid;
      align-content: center;
      gap: 4px;
    }

    .result-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .result-value {
      font-size: 20px;
      font-weight: 950;
    }

    @media (max-height: 700px) {
      .game {
        padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
        gap: 8px;
      }

      .stat {
        min-height: 50px;
        padding: 6px;
      }

      .value {
        font-size: 18px;
      }

      .board {
        width: calc(100vw - 32px);
        max-width: 380px;
        max-height: calc(100svh - 122px);
        gap: 6px;
      }

      .footer {
        min-height: 40px;
        font-size: 12px;
      }

      .footer button {
        min-height: 38px;
        min-width: 86px;
        padding: 0 12px;
      }

      .screen {
        inset: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
        padding: 14px;
      }

      .menu-card {
        gap: 12px;
      }

      .menu-actions button {
        min-height: 46px;
      }
    }
  </style>
</head>
<body>
  <main class="game" aria-label="Fortune Tiles matching game">
    <section class="stats" aria-label="Game statistics">
      <div class="stat">
        <span class="label">Pairs</span>
        <span class="value" id="pairs">0/10</span>
      </div>
      <div class="stat">
        <span class="label">Moves</span>
        <span class="value" id="moves">0</span>
      </div>
      <div class="stat">
        <span class="label">Time</span>
        <span class="value" id="time">0:00</span>
      </div>
    </section>

    <section class="board-wrap">
      <div class="board" id="board" aria-label="Tile board"></div>
    </section>

    <div class="footer">
      <span id="message">Find the first fortune pair.</span>
      <button id="restart" type="button">Restart</button>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <section class="screen active" id="startScreen" aria-label="Start menu">
      <div class="menu-card">
        <span class="menu-kicker">Memory Match</span>
        <h1 class="menu-title">Fortune Tiles</h1>
        <p class="menu-text">Open tiles, remember each symbol, and match all fortune pairs with as few moves as possible.</p>
        <div class="menu-actions">
          <button id="startGame" type="button">Start Game</button>
        </div>
      </div>
    </section>

    <section class="screen" id="resultScreen" aria-label="Results menu">
      <div class="menu-card">
        <span class="menu-kicker">Round Complete</span>
        <h2 class="menu-title">Results</h2>
        <div class="result-grid">
          <div class="result-item">
            <span class="result-label">Moves</span>
            <span class="result-value" id="resultMoves">0</span>
          </div>
          <div class="result-item">
            <span class="result-label">Time</span>
            <span class="result-value" id="resultTime">0:00</span>
          </div>
          <div class="result-item">
            <span class="result-label">Best</span>
            <span class="result-value" id="resultBest">-</span>
          </div>
        </div>
        <p class="menu-text" id="resultMessage">All fortune pairs are aligned.</p>
        <div class="menu-actions">
          <button id="playAgain" type="button">Play Again</button>
          <button class="ghost-button" id="backToMenu" type="button">Main Menu</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const symbols = ["🍎", "🍐", "🍊", "🍋", "🍓", "🍇", "🍒", "🥝", "🍍", "🍉"];
    const glows = [
      "linear-gradient(135deg, #ffe7df, #ff7c78)",
      "linear-gradient(135deg, #f1ffd8, #9ee15d)",
      "linear-gradient(135deg, #fff0c8, #ff9d35)",
      "linear-gradient(135deg, #fffbd0, #ffe24e)",
      "linear-gradient(135deg, #ffe1ec, #ff5f93)",
      "linear-gradient(135deg, #eadcff, #8a62db)",
      "linear-gradient(135deg, #ffe4ea, #c82753)",
      "linear-gradient(135deg, #e8ffd6, #55c96f)",
      "linear-gradient(135deg, #fff3b2, #f2a841)",
      "linear-gradient(135deg, #d8fff0, #ff6c74)"
    ];

    const board = document.getElementById("board");
    const pairEl = document.getElementById("pairs");
    const moveEl = document.getElementById("moves");
    const timeEl = document.getElementById("time");
    const message = document.getElementById("message");
    const toast = document.getElementById("toast");
    const restart = document.getElementById("restart");
    const startScreen = document.getElementById("startScreen");
    const resultScreen = document.getElementById("resultScreen");
    const startGame = document.getElementById("startGame");
    const playAgain = document.getElementById("playAgain");
    const backToMenu = document.getElementById("backToMenu");
    const resultMoves = document.getElementById("resultMoves");
    const resultTime = document.getElementById("resultTime");
    const resultBest = document.getElementById("resultBest");
    const resultMessage = document.getElementById("resultMessage");
    const bestKey = "fortune_tiles_best_result";

    let deck = [];
    let openTiles = [];
    let matched = 0;
    let moves = 0;
    let lock = false;
    let startedAt = 0;
    let timer = 0;
    let resultTimer = 0;

    function shuffle(items) {
      return items
        .map((item) => ({ item, sort: Math.random() }))
        .sort((a, b) => a.sort - b.sort)
        .map(({ item }) => item);
    }

    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = String(totalSeconds % 60).padStart(2, "0");
      return `${minutes}:${seconds}`;
    }

    function startClock() {
      if (timer) return;
      startedAt = Date.now();
      timer = window.setInterval(() => {
        timeEl.textContent = formatTime(Math.floor((Date.now() - startedAt) / 1000));
      }, 500);
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("show");
      window.clearTimeout(showToast.timeout);
      showToast.timeout = window.setTimeout(() => toast.classList.remove("show"), 1600);
    }

    function showScreen(screen) {
      startScreen.classList.toggle("active", screen === startScreen);
      resultScreen.classList.toggle("active", screen === resultScreen);
    }

    function hideScreens() {
      startScreen.classList.remove("active");
      resultScreen.classList.remove("active");
    }

    function updateStats() {
      pairEl.textContent = `${matched}/${symbols.length}`;
      moveEl.textContent = moves;
    }

    function getElapsedSeconds() {
      if (!startedAt) return 0;
      return Math.floor((Date.now() - startedAt) / 1000);
    }

    function getBestResult() {
      try {
        const result = JSON.parse(localStorage.getItem(bestKey));
        if (!result || typeof result.moves !== "number" || typeof result.seconds !== "number") return null;
        return result;
      } catch (error) {
        return null;
      }
    }

    function saveBestResult(seconds) {
      const current = getBestResult();
      const next = { moves, seconds };
      if (!current || moves < current.moves || (moves === current.moves && seconds < current.seconds)) {
        localStorage.setItem(bestKey, JSON.stringify(next));
        return { best: next, isNew: true };
      }
      return { best: current, isNew: false };
    }

    function showResults() {
      const seconds = getElapsedSeconds();
      const result = saveBestResult(seconds);
      resultMoves.textContent = moves;
      resultTime.textContent = formatTime(seconds);
      resultBest.textContent = result.best ? `${result.best.moves}/${formatTime(result.best.seconds)}` : "-";
      resultMessage.textContent = result.isNew ? "New best alignment recorded." : "All fortune pairs are aligned.";
      showScreen(resultScreen);
    }

    function buildTile(card, index) {
      const tile = document.createElement("button");
      tile.type = "button";
      tile.className = "tile";
      tile.dataset.symbol = card.symbol;
      tile.dataset.id = `${card.symbol}-${index}`;
      tile.style.setProperty("--tile-glow", card.glow);
      tile.setAttribute("aria-label", "Hidden fortune tile");
      tile.innerHTML = `
        <span class="face back"></span>
        <span class="face front">${card.symbol}</span>
      `;
      tile.addEventListener("click", () => reveal(tile));
      return tile;
    }

    function reveal(tile) {
      if (lock || tile.classList.contains("revealed") || tile.classList.contains("matched")) return;
      startClock();
      tile.classList.add("revealed");
      tile.setAttribute("aria-label", `Revealed ${tile.dataset.symbol}`);
      openTiles.push(tile);

      if (openTiles.length !== 2) return;
      moves += 1;
      updateStats();
      const [first, second] = openTiles;

      if (first.dataset.symbol === second.dataset.symbol) {
        first.classList.add("matched");
        second.classList.add("matched");
        openTiles = [];
        matched += 1;
        message.textContent = matched === symbols.length ? "All fortunes aligned." : "Pair found. Keep going.";
        updateStats();
        if (matched === symbols.length) {
          window.clearInterval(timer);
          showToast(`Perfect alignment in ${moves} moves.`);
          resultTimer = window.setTimeout(showResults, 700);
        }
        return;
      }

      lock = true;
      message.textContent = "Not a pair. Try another memory path.";
      window.setTimeout(() => {
        first.classList.remove("revealed");
        second.classList.remove("revealed");
        first.setAttribute("aria-label", "Hidden fortune tile");
        second.setAttribute("aria-label", "Hidden fortune tile");
        openTiles = [];
        lock = false;
      }, 720);
    }

    function newGame() {
      window.clearInterval(timer);
      window.clearTimeout(resultTimer);
      timer = 0;
      resultTimer = 0;
      startedAt = 0;
      openTiles = [];
      matched = 0;
      moves = 0;
      lock = false;
      timeEl.textContent = "0:00";
      message.textContent = "Find the first fortune pair.";
      deck = shuffle([...symbols, ...symbols].map((symbol) => ({
        symbol,
        glow: glows[symbols.indexOf(symbol)]
      })));
      board.replaceChildren(...deck.map(buildTile));
      updateStats();
    }

    function beginRound() {
      hideScreens();
      newGame();
    }

    function openMainMenu() {
      newGame();
      showScreen(startScreen);
    }

    startGame.addEventListener("click", beginRound);
    playAgain.addEventListener("click", beginRound);
    backToMenu.addEventListener("click", openMainMenu);
    restart.addEventListener("click", beginRound);
    newGame();
  </script>
</body>
</html>
