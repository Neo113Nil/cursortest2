<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fortune Odd</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#040810;color:#fff8e7;-webkit-tap-highlight-color:transparent}
.bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(ellipse 90% 60% at 50% 45%,rgba(255,184,0,0.07) 0%,transparent 55%),radial-gradient(circle at 15% 25%,rgba(65,105,225,0.14) 0%,transparent 22%),radial-gradient(circle at 85% 75%,rgba(124,58,237,0.12) 0%,transparent 22%),radial-gradient(circle at 70% 15%,rgba(192,38,211,0.08) 0%,transparent 18%),radial-gradient(circle at 30% 80%,rgba(255,215,0,0.06) 0%,transparent 16%),linear-gradient(180deg,#030610 0%,#0a0e1a 45%,#0d1028 100%)}
.bg-fx::before{content:'';position:absolute;inset:0;background:radial-gradient(circle 3px at 12% 18%,rgba(255,215,0,0.7) 0%,transparent 100%),radial-gradient(circle 2px at 28% 62%,rgba(255,184,0,0.5) 0%,transparent 100%),radial-gradient(circle 4px at 45% 35%,rgba(255,255,255,0.35) 0%,transparent 100%),radial-gradient(circle 2px at 58% 78%,rgba(255,215,0,0.6) 0%,transparent 100%),radial-gradient(circle 3px at 72% 22%,rgba(255,184,0,0.55) 0%,transparent 100%),radial-gradient(circle 2px at 88% 55%,rgba(255,255,255,0.4) 0%,transparent 100%),radial-gradient(circle 5px at 22% 88%,rgba(65,105,225,0.25) 0%,transparent 100%),radial-gradient(circle 4px at 92% 12%,rgba(124,58,237,0.3) 0%,transparent 100%),radial-gradient(circle 6px at 8% 45%,rgba(65,105,225,0.15) 0%,transparent 100%),radial-gradient(circle 5px at 55% 8%,rgba(192,38,211,0.12) 0%,transparent 100%);animation:sparkle 4s ease-in-out infinite alternate}
.bg-fx::after{content:'';position:absolute;top:42%;left:-10%;width:120%;height:2px;background:linear-gradient(90deg,transparent 0%,rgba(65,105,225,0.4) 20%,rgba(255,215,0,0.6) 50%,rgba(124,58,237,0.35) 80%,transparent 100%);filter:blur(1px);animation:streak 6s ease-in-out infinite}
@keyframes sparkle{0%{opacity:0.5;transform:translateY(0)}100%{opacity:1;transform:translateY(-6px)}}
@keyframes streak{0%,100%{opacity:0.3;transform:translateX(-5%) scaleY(1)}50%{opacity:0.7;transform:translateX(5%) scaleY(1.5)}}
.screen{position:absolute;inset:0;z-index:1;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;background:transparent}
.screen.active{display:flex}
.overlay-panel{background:rgba(6,10,22,0.82);border:1px solid rgba(255,215,0,0.22);border-radius:16px;padding:20px 24px;text-align:center;max-width:360px;width:100%;box-shadow:0 0 24px rgba(65,105,225,0.12),0 0 48px rgba(255,184,0,0.06),inset 0 1px 0 rgba(255,255,255,0.04)}
.overlay-panel h1{font-size:34px;font-weight:800;margin-bottom:8px;letter-spacing:3px;text-transform:uppercase;background:linear-gradient(180deg,#fffef0 0%,#ffe566 18%,#ffd700 45%,#ffb800 72%,#c8960c 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 6px rgba(255,215,0,0.8)) drop-shadow(0 0 18px rgba(255,184,0,0.5)) drop-shadow(0 0 32px rgba(65,105,225,0.25))}
.overlay-panel h2{font-size:24px;font-weight:800;margin-bottom:12px;letter-spacing:1px;background:linear-gradient(180deg,#fff8dc,#ffd700,#ffb800);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 10px rgba(255,215,0,0.5))}
.overlay-panel p{font-size:15px;font-weight:600;color:rgba(255,248,231,0.85);line-height:1.5;margin-bottom:12px}
.stat-row{display:flex;justify-content:center;gap:24px;margin:16px 0}
.stat-item{text-align:center}
.stat-value{font-size:24px;font-weight:800;color:#ffd700;text-shadow:0 0 10px rgba(255,215,0,0.55),0 0 24px rgba(255,184,0,0.25)}
.stat-label{font-size:13px;font-weight:700;color:rgba(255,215,0,0.65);margin-top:4px;text-transform:uppercase;letter-spacing:0.8px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border:none;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;margin-top:10px;touch-action:manipulation;letter-spacing:0.3px;text-align:center}
.btn-primary{background:linear-gradient(135deg,#fff0a0 0%,#ffd700 25%,#ffb800 65%,#c8960c 100%);color:#1a0a00;box-shadow:0 4px 20px rgba(255,184,0,0.45),0 0 32px rgba(255,215,0,0.18);border:1px solid rgba(255,230,100,0.55)}
.btn-secondary{background:rgba(65,105,225,0.12);color:#e8e0ff;border:1px solid rgba(124,58,237,0.4);box-shadow:0 0 16px rgba(65,105,225,0.15),inset 0 1px 0 rgba(255,255,255,0.05)}
.btn-danger{background:linear-gradient(135deg,rgba(220,38,38,0.9),rgba(153,27,27,0.95));color:#fff;border:1px solid rgba(248,113,113,0.35);box-shadow:0 4px 16px rgba(220,38,38,0.35)}
.btn:active{transform:scale(0.97);opacity:0.9}
.icon-inline{width:20px;height:20px;vertical-align:middle;margin-right:6px}
#screen-game{padding:0;justify-content:flex-start;min-height:0}
.game-hud{width:100%;padding:40px 12px 10px;flex-shrink:0}
.hud-bar{display:flex;align-items:center;justify-content:space-between;gap:4px;background:rgba(6,10,22,0.88);border:1px solid rgba(255,215,0,0.2);border-radius:14px;padding:8px 10px;box-shadow:0 0 20px rgba(65,105,225,0.1),0 0 36px rgba(255,184,0,0.05),inset 0 1px 0 rgba(255,255,255,0.04)}
.hud-stat{flex:1;min-width:0;text-align:center;padding:2px 4px}
.hud-stat .stat-value{font-size:clamp(16px,4.5vw,20px);line-height:1.1}
.hud-stat .stat-label{font-size:10px;letter-spacing:0.5px;margin-top:2px}
.hud-timer{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 10px;border-radius:10px;background:rgba(255,215,0,0.08);border:1px solid rgba(255,215,0,0.25);min-width:64px}
.hud-timer svg{width:18px;height:18px;flex-shrink:0}
.hud-timer span{font-size:clamp(18px,5vw,22px);font-weight:800;color:#ffd700;text-shadow:0 0 10px rgba(255,215,0,0.55);line-height:1}
.grid-wrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;padding:6px 12px;min-height:0;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(5px,1.8vw,8px);width:100%;max-width:min(380px,96vw);aspect-ratio:1;padding:clamp(6px,2vw,10px);border-radius:14px;border:1px solid rgba(255,215,0,0.12);box-shadow:0 0 30px rgba(65,105,225,0.1),inset 0 0 20px rgba(0,0,0,0.3)}
.tile{border-radius:10px;border:2px solid rgba(255,215,0,0.1);cursor:pointer;touch-action:manipulation;min-height:44px;transition:transform 0.1s,box-shadow 0.15s}
.tile:active{transform:scale(0.92)}
.tile.flash-correct{box-shadow:0 0 22px 5px rgba(255,215,0,0.75),0 0 40px rgba(255,184,0,0.4);border-color:#ffd700}
.tile.flash-wrong{box-shadow:0 0 22px 5px rgba(239,68,68,0.7),0 0 36px rgba(220,38,38,0.35);border-color:#ef4444}
.game-bottom{width:100%;padding:8px 12px 16px;flex-shrink:0}
.game-bottom .overlay-panel{padding:10px 12px;border-radius:12px}
.round-info{font-size:13px;font-weight:700;color:rgba(255,248,231,0.85);margin-bottom:8px;line-height:1.3}
.game-bottom .btn{min-height:44px;margin-top:0;font-size:15px}
.result-stats{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;width:100%;margin:20px 0}
.result-stats .stat-item{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-width:0;width:100%}
.result-stats .stat-value{font-variant-numeric:tabular-nums;width:100%;text-align:center;line-height:1.2}
.result-stats .stat-label{width:100%;text-align:center;margin-top:4px}
.result-stats .stat-item.is-hidden{visibility:hidden;pointer-events:none}
#screen-result .overlay-panel{max-width:380px;text-align:center}
#screen-result .overlay-panel h2,#screen-result .overlay-panel p{width:100%;text-align:center}
#result-new{color:#ffd700;text-shadow:0 0 14px rgba(255,215,0,0.7);animation:pulse-gold 1.2s ease-in-out infinite alternate}
@keyframes pulse-gold{0%{filter:brightness(1)}100%{filter:brightness(1.3)}}
</style>
</head>
<body>
<div class="bg-fx" aria-hidden="true"></div>
<section id="screen-menu" class="screen active">
<div class="overlay-panel">
<h1>Fortune Odd</h1>
<p>Find the tile with a different shade before time runs out.</p>
<div class="stat-row">
<div class="stat-item">
<div class="stat-value" id="menu-best">0</div>
<div class="stat-label">Best Score</div>
</div>
<div class="stat-item">
<div class="stat-value" id="menu-games">0</div>
<div class="stat-label">Games Played</div>
</div>
</div>
<button class="btn btn-primary" id="btn-play">
<svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="#1a0a00" stroke-width="2.5"><polygon points="5,3 19,12 5,21"/></svg>
Play
</button>
</div>
</section>
<section id="screen-game" class="screen">
<div class="game-hud">
<div class="hud-bar">
<div class="hud-stat">
<div class="stat-value" id="hud-score">0</div>
<div class="stat-label">Score</div>
</div>
<div class="hud-timer">
<svg viewBox="0 0 24 24" fill="none" stroke="#ffd700" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
<span id="hud-timer">30</span>
</div>
<div class="hud-stat">
<div class="stat-value" id="hud-round">1</div>
<div class="stat-label">Round</div>
</div>
</div>
</div>
<div class="grid-wrap">
<div class="grid" id="grid"></div>
</div>
<div class="game-bottom">
<div class="overlay-panel">
<div class="round-info">Find the tile with a slightly different shade</div>
<button class="btn btn-danger" id="btn-quit">Quit</button>
</div>
</div>
</section>
<section id="screen-result" class="screen">
<div class="overlay-panel">
<h2 id="result-title">Time Up</h2>
<p id="result-message">Better luck next time.</p>
<div class="result-stats">
<div class="stat-item">
<div class="stat-value" id="result-score">0</div>
<div class="stat-label">Score</div>
</div>
<div class="stat-item">
<div class="stat-value" id="result-rounds">0</div>
<div class="stat-label">Rounds</div>
</div>
<div class="stat-item">
<div class="stat-value" id="result-best">0</div>
<div class="stat-label">Best Score</div>
</div>
<div class="stat-item is-hidden" id="result-new-wrap">
<div class="stat-value" id="result-new">NEW!</div>
<div class="stat-label" id="result-new-label">Record</div>
</div>
</div>
<button class="btn btn-primary" id="btn-replay">
<svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="#1a0a00" stroke-width="2.5"><polyline points="1,4 1,10 7,10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
Play Again
</button>
<button class="btn btn-secondary" id="btn-menu">Main Menu</button>
</div>
</section>
<script>
(function(){
var LS_BEST='fo_best';
var LS_GAMES='fo_games';
var START_TIME=30;
var START_DELTA=9;
var MIN_DELTA=3;
var DELTA_STEP=0.35;
var ODD_BOOST=1.5;
var SCORE_BASE=100;
var TIME_BONUS=2;
var MAX_TIME=45;
var screens={menu:document.getElementById('screen-menu'),game:document.getElementById('screen-game'),result:document.getElementById('screen-result')};
var gridEl=document.getElementById('grid');
var state={score:0,round:1,delta:START_DELTA,timeLeft:START_TIME,oddIndex:-1,playing:false,timerStart:0,timerRaf:0,endReason:''};
function loadInt(key,def){var v=localStorage.getItem(key);return v?parseInt(v,10):def}
function saveInt(key,val){localStorage.setItem(key,String(val))}
function showScreen(name){Object.keys(screens).forEach(function(k){screens[k].classList.toggle('active',k===name)})}
function updateMenuStats(){
document.getElementById('menu-best').textContent=loadInt(LS_BEST,0);
document.getElementById('menu-games').textContent=loadInt(LS_GAMES,0);
}
function hsl(h,s,l){return 'hsl('+h+','+s+'%,'+l+'%)'}
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function generateRound(){
var palettes=[[48,78,50],[225,72,48],[278,68,50],[165,62,46],[18,82,52],[310,60,48]];
var p=palettes[rand(0,palettes.length-1)];
var hue=Math.max(0,Math.min(359,p[0]+rand(-6,6)));
var sat=Math.max(55,Math.min(90,p[1]+rand(-4,4)));
var light=Math.max(35,Math.min(60,p[2]+rand(-3,3)));
var direction=Math.random()>0.5?1:-1;
var oddLight=Math.max(10,Math.min(90,light+direction*(state.delta+ODD_BOOST)));
var baseColor=hsl(hue,sat,light);
var oddColor=hsl(hue,sat,oddLight);
state.oddIndex=rand(0,15);
gridEl.innerHTML='';
for(var i=0;i<16;i++){
var tile=document.createElement('div');
tile.className='tile';
tile.style.backgroundColor=i===state.oddIndex?oddColor:baseColor;
tile.dataset.index=String(i);
tile.addEventListener('click',onTileTap);
gridEl.appendChild(tile);
}
document.getElementById('hud-round').textContent=state.round;
document.getElementById('hud-score').textContent=state.score;
}
function updateTimerDisplay(){
document.getElementById('hud-timer').textContent=Math.ceil(state.timeLeft);
}
function timerLoop(){
if(!state.playing)return;
var passed=(performance.now()-state.timerStart)/1000;
state.timeLeft=Math.max(0,state.totalTime-passed);
updateTimerDisplay();
if(state.timeLeft<=0){endGame('timeout');return}
state.timerRaf=requestAnimationFrame(timerLoop);
}
function startGame(){
state.score=0;
state.round=1;
state.delta=START_DELTA;
state.totalTime=START_TIME;
state.timeLeft=START_TIME;
state.playing=true;
state.endReason='';
document.getElementById('hud-score').textContent='0';
document.getElementById('hud-round').textContent='1';
document.getElementById('hud-timer').textContent=START_TIME;
generateRound();
state.timerStart=performance.now();
cancelAnimationFrame(state.timerRaf);
state.timerRaf=requestAnimationFrame(timerLoop);
showScreen('game');
}
function onTileTap(e){
if(!state.playing)return;
var idx=parseInt(e.currentTarget.dataset.index,10);
if(idx===state.oddIndex){
state.score+=SCORE_BASE+(state.round*10);
state.round++;
state.delta=Math.max(MIN_DELTA,state.delta-DELTA_STEP);
state.totalTime=Math.min(MAX_TIME,state.totalTime+TIME_BONUS);
e.currentTarget.classList.add('flash-correct');
document.getElementById('hud-score').textContent=state.score;
setTimeout(function(){
generateRound();
},200);
}else{
e.currentTarget.classList.add('flash-wrong');
endGame('wrong');
}
}
function endGame(reason){
if(!state.playing)return;
state.playing=false;
state.endReason=reason;
cancelAnimationFrame(state.timerRaf);
var rounds=state.round-1;
if(reason==='quit')rounds=state.round>1?state.round-1:0;
if(reason==='wrong')rounds=state.round-1;
if(reason==='timeout')rounds=state.round-1;
if(rounds<0)rounds=0;
var best=loadInt(LS_BEST,0);
var isNew=state.score>best;
if(isNew){saveInt(LS_BEST,state.score);best=state.score}
saveInt(LS_GAMES,loadInt(LS_GAMES,0)+1);
var titleEl=document.getElementById('result-title');
var msgEl=document.getElementById('result-message');
if(reason==='timeout'){titleEl.textContent='Time Up';msgEl.textContent='The clock ran out. Try again!';}
else if(reason==='wrong'){titleEl.textContent='Wrong Tile';msgEl.textContent='That was not the odd one. Keep practicing!';}
else if(reason==='quit'){titleEl.textContent='Round Ended';msgEl.textContent='You quit this round.';}
else{titleEl.textContent='Great Run';msgEl.textContent='Amazing performance!';}
document.getElementById('result-score').textContent=state.score;
document.getElementById('result-rounds').textContent=rounds;
document.getElementById('result-best').textContent=best;
var newWrap=document.getElementById('result-new-wrap');
var newEl=document.getElementById('result-new');
if(isNew&&state.score>0){newWrap.classList.remove('is-hidden');newEl.textContent='NEW!';}
else{newWrap.classList.add('is-hidden');}
showScreen('result');
}
document.getElementById('btn-play').addEventListener('click',startGame);
document.getElementById('btn-quit').addEventListener('click',function(){endGame('quit')});
document.getElementById('btn-replay').addEventListener('click',startGame);
document.getElementById('btn-menu').addEventListener('click',function(){updateMenuStats();showScreen('menu')});
updateMenuStats();
})();
</script>
</body>
</html>
