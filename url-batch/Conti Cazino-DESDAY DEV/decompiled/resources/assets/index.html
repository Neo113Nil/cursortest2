<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Play Minus</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0a0612;color:#fff;-webkit-tap-highlight-color:transparent}
.app{position:fixed;inset:0;display:flex;flex-direction:column;background:#0a0612}
.bg-brick{position:absolute;inset:0;pointer-events:none;background-color:#141018;background-image:linear-gradient(335deg,rgba(0,0,0,.4) 23px,transparent 23px),linear-gradient(155deg,rgba(0,0,0,.4) 23px,transparent 23px),linear-gradient(335deg,rgba(0,0,0,.4) 23px,transparent 23px),linear-gradient(155deg,rgba(0,0,0,.4) 23px,transparent 23px);background-size:58px 34px;background-position:0 0,29px 17px,29px 17px,0 0}
.bg-brick::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 40%,rgba(255,0,170,.12) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 30% 70%,rgba(0,240,255,.08) 0%,transparent 50%),linear-gradient(180deg,rgba(10,6,18,.3) 0%,rgba(10,6,18,.85) 70%,rgba(20,12,28,.95) 100%)}
.bg-floor{position:absolute;bottom:0;left:0;right:0;height:18%;pointer-events:none;background:linear-gradient(180deg,transparent 0%,rgba(30,20,40,.6) 40%,rgba(15,10,22,.95) 100%);box-shadow:inset 0 20px 40px rgba(255,0,170,.06)}
.bg-fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bg-fx svg{width:100%;height:100%}
.bg-beams{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,240,255,.04) 0%,transparent 30%),linear-gradient(90deg,transparent 40%,rgba(255,0,170,.05) 50%,transparent 60%)}
.bg-particles{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 10% 20%,rgba(0,240,255,.8) 0%,transparent 100%),radial-gradient(1px 1px at 85% 15%,rgba(255,0,170,.7) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 50% 45%,rgba(255,255,255,.5) 0%,transparent 100%),radial-gradient(1px 1px at 70% 60%,rgba(0,240,255,.6) 0%,transparent 100%),radial-gradient(1px 1px at 25% 75%,rgba(255,0,170,.5) 0%,transparent 100%),radial-gradient(1px 1px at 90% 80%,rgba(0,240,255,.4) 0%,transparent 100%)}
.waveform{position:absolute;top:50%;left:0;right:0;height:60px;transform:translateY(-50%);opacity:.35;pointer-events:none}
.lightning{position:absolute;inset:0;opacity:.55;pointer-events:none}
@keyframes pulse-glow{0%,100%{opacity:.4}50%{opacity:.75}}
@keyframes wave-shift{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes flicker{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.6}94%{opacity:1}96%{opacity:.8}97%{opacity:1}}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom));z-index:2}
.screen.active{display:flex}
.panel{background:rgba(12,8,22,.82);border:1px solid rgba(0,240,255,.35);border-radius:16px;padding:20px 24px;box-shadow:0 0 20px rgba(0,240,255,.08),0 8px 32px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(8px)}
.menu-panel{text-align:center;max-width:360px;width:100%;border-color:rgba(255,0,170,.4);box-shadow:0 0 30px rgba(255,0,170,.12),0 0 60px rgba(0,240,255,.08),0 8px 32px rgba(0,0,0,.6)}
.menu-logo{width:120px;height:120px;margin:0 auto 12px;display:block;filter:drop-shadow(0 0 12px rgba(0,240,255,.6)) drop-shadow(0 0 24px rgba(255,0,170,.4));animation:flicker 4s infinite}
.menu-title-wrap{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.menu-title-play{font-size:2.6rem;font-weight:900;letter-spacing:.04em;background:linear-gradient(90deg,#00f0ff 0%,#e040fb 50%,#ff0080 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 8px rgba(0,240,255,.8)) drop-shadow(0 0 16px rgba(255,0,170,.5))}
.menu-title-minus{font-size:2rem;font-weight:900;color:#ff0080;text-shadow:0 0 10px rgba(255,0,170,.9),0 0 20px rgba(255,0,170,.5),0 0 40px rgba(0,240,255,.3);-webkit-text-fill-color:#ff0080}
.menu-sub{font-size:.95rem;color:rgba(220,210,240,.85);line-height:1.5;margin-bottom:24px;text-shadow:0 0 8px rgba(0,240,255,.2)}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:14px 28px;border:none;border-radius:12px;font-size:1.15rem;font-weight:800;cursor:pointer;touch-action:manipulation;width:100%;margin-top:12px;letter-spacing:.06em;text-transform:uppercase;position:relative;overflow:hidden}
.btn-primary{background:linear-gradient(135deg,#00f0ff 0%,#7b2ff7 50%,#ff0080 100%);color:#fff;border:1px solid rgba(255,255,255,.25);box-shadow:0 0 20px rgba(0,240,255,.4),0 0 40px rgba(255,0,170,.2),inset 0 1px 0 rgba(255,255,255,.3);text-shadow:0 0 8px rgba(255,255,255,.5)}
.btn-secondary{background:rgba(255,0,170,.15);color:#fff;border:1px solid rgba(255,0,170,.55);box-shadow:0 0 16px rgba(255,0,170,.2),inset 0 1px 0 rgba(255,255,255,.1)}
.btn:active{transform:scale(.97)}
.best-row{margin-top:20px;border-color:rgba(0,240,255,.25)}
.best-label{font-size:.85rem;color:rgba(200,190,220,.8);margin-bottom:4px;text-transform:uppercase;letter-spacing:.1em}
.best-value{font-size:1.8rem;font-weight:900;color:#00f0ff;text-shadow:0 0 12px rgba(0,240,255,.8),0 0 24px rgba(0,240,255,.4)}
.game-screen{justify-content:flex-start;padding:0}
.game-top{width:100%;display:flex;justify-content:space-between;align-items:center;padding:40px 16px 20px;padding-top:calc(40px + env(safe-area-inset-top));gap:8px}
.stat-panel{flex:1;text-align:center;padding:10px 6px;min-width:0;border-radius:12px}
.stat-label{font-size:.7rem;color:rgba(200,190,220,.75);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.stat-value{font-size:1.2rem;font-weight:800;color:#fff;text-shadow:0 0 6px rgba(255,255,255,.3)}
.stat-value.accent{color:#00f0ff;text-shadow:0 0 10px rgba(0,240,255,.7)}
.stat-value.streak{color:#ff0080;text-shadow:0 0 10px rgba(255,0,170,.7)}
.game-body{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 20px 32px;gap:20px}
.target-panel{text-align:center;padding:24px 36px;min-width:200px;border-color:rgba(255,0,170,.4);box-shadow:0 0 30px rgba(255,0,170,.15),0 8px 32px rgba(0,0,0,.5)}
.target-label{font-size:.85rem;color:rgba(200,190,220,.8);margin-bottom:8px;text-transform:uppercase;letter-spacing:.12em}
.target-num{font-size:4.5rem;font-weight:900;line-height:1;background:linear-gradient(180deg,#00f0ff 0%,#e040fb 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 20px rgba(0,240,255,.7)) drop-shadow(0 0 40px rgba(255,0,170,.4))}
.hint-panel{font-size:.9rem;color:rgba(200,190,220,.75);text-align:center;padding:10px 16px;border-color:rgba(0,240,255,.2)}
.grid-wrap{width:100%;max-width:360px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.num-btn{min-height:64px;border:2px solid rgba(0,240,255,.3);border-radius:14px;background:rgba(12,8,22,.85);color:#fff;font-size:1.75rem;font-weight:800;cursor:pointer;touch-action:manipulation;transition:border-color .15s,background .15s,transform .1s,box-shadow .15s;text-shadow:0 0 8px rgba(0,240,255,.3)}
.num-btn:active{transform:scale(.95)}
.num-btn.selected{border-color:#ff0080;background:rgba(255,0,170,.15);box-shadow:0 0 20px rgba(255,0,170,.5),inset 0 0 12px rgba(255,0,170,.1);text-shadow:0 0 10px rgba(255,0,170,.6)}
.num-btn.correct-flash{border-color:#00f0ff;background:rgba(0,240,255,.15);box-shadow:0 0 24px rgba(0,240,255,.6)}
.num-btn.wrong-flash{border-color:#ff3366;background:rgba(255,51,102,.2);box-shadow:0 0 20px rgba(255,51,102,.5);animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.results-panel{max-width:360px;width:100%;text-align:center;border-color:rgba(255,0,170,.35);box-shadow:0 0 40px rgba(255,0,170,.1),0 0 60px rgba(0,240,255,.08)}
.results-title{font-size:1.75rem;font-weight:900;margin-bottom:20px;background:linear-gradient(90deg,#00f0ff,#e040fb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 8px rgba(0,240,255,.5))}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(0,240,255,.15)}
.result-row:last-of-type{border-bottom:none}
.result-label{font-size:1rem;color:rgba(200,190,220,.8)}
.result-value{font-size:1.25rem;font-weight:800;color:#fff}
.result-value.highlight{color:#00f0ff;text-shadow:0 0 8px rgba(0,240,255,.6)}
.result-value.gold{color:#ff0080;text-shadow:0 0 8px rgba(255,0,170,.6)}
.results-btns{margin-top:24px;display:flex;flex-direction:column;gap:0}
.feedback{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);opacity:0;pointer-events:none;z-index:10;padding:16px 32px;border-radius:12px;font-size:1.25rem;font-weight:800;transition:opacity .2s,transform .2s}
.feedback.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.feedback.ok{background:rgba(0,240,255,.9);color:#0a0612;border:2px solid #00f0ff;box-shadow:0 0 30px rgba(0,240,255,.6)}
.feedback.bad{background:rgba(255,0,80,.9);color:#fff;border:2px solid #ff0080;box-shadow:0 0 30px rgba(255,0,170,.6)}
</style>
</head>
<body>
<div class="app">
<div class="bg-brick"></div>
<div class="bg-floor"></div>
<div class="bg-beams"></div>
<div class="bg-particles"></div>
<div class="bg-fx">
<svg class="waveform" viewBox="0 0 800 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="wg" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#00f0ff"/>
<stop offset="50%" stop-color="#e040fb"/>
<stop offset="100%" stop-color="#ff0080"/>
</linearGradient>
</defs>
<path d="M0,30 L20,10 L40,50 L60,15 L80,45 L100,20 L120,40 L140,25 L160,35 L180,10 L200,50 L220,20 L240,40 L260,15 L280,45 L300,25 L320,35 L340,10 L360,50 L380,20 L400,40 L420,15 L440,45 L460,25 L480,35 L500,10 L520,50 L540,20 L560,40 L580,15 L600,45 L620,25 L640,35 L660,10 L680,50 L700,20 L720,40 L740,15 L760,45 L780,25 L800,30" fill="none" stroke="url(#wg)" stroke-width="2" opacity=".8"/>
<path d="M0,30 L20,10 L40,50 L60,15 L80,45 L100,20 L120,40 L140,25 L160,35 L180,10 L200,50 L220,20 L240,40 L260,15 L280,45 L300,25 L320,35 L340,10 L360,50 L380,20 L400,40 L420,15 L440,45 L460,25 L480,35 L500,10 L520,50 L540,20 L560,40 L580,15 L600,45 L620,25 L640,35 L660,10 L680,50 L700,20 L720,40 L740,15 L760,45 L780,25 L800,30" fill="none" stroke="url(#wg)" stroke-width="1" opacity=".4" transform="translate(0,8)"/>
</svg>
<svg class="lightning" viewBox="0 0 400 700" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
<defs>
<filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<path d="M200,120 L185,200 L210,180 L170,280 L200,260 L160,380 L200,340 L175,460 L200,420 L190,560" fill="none" stroke="#00f0ff" stroke-width="2" filter="url(#glow)" opacity=".7"/>
<path d="M200,120 L215,190 L195,210 L230,270 L200,290 L240,350 L200,370 L225,430 L200,450 L210,540" fill="none" stroke="#ff0080" stroke-width="1.5" filter="url(#glow)" opacity=".6"/>
<path d="M120,200 L100,260 L130,240 L90,320 L115,300 L80,400 L120,360" fill="none" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow)" opacity=".5"/>
<path d="M280,180 L300,240 L270,260 L310,330 L285,310 L320,390 L280,370" fill="none" stroke="#ff0080" stroke-width="1.5" filter="url(#glow)" opacity=".5"/>
<path d="M60,300 L45,360 L70,340 L40,420 L65,400 L35,500" fill="none" stroke="#00f0ff" stroke-width="1" filter="url(#glow)" opacity=".4"/>
<path d="M340,280 L355,340 L330,360 L365,430 L340,410 L370,490" fill="none" stroke="#ff0080" stroke-width="1" filter="url(#glow)" opacity=".4"/>
<path d="M150,450 L135,510 L160,490 L130,560 L155,540" fill="none" stroke="#e040fb" stroke-width="1" filter="url(#glow)" opacity=".35"/>
<path d="M250,440 L265,500 L240,520 L275,580 L250,560" fill="none" stroke="#00f0ff" stroke-width="1" filter="url(#glow)" opacity=".35"/>
</svg>
</div>
<section id="menu" class="screen active">
<div class="panel menu-panel">
<svg class="menu-logo" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#00f0ff"/>
<stop offset="50%" stop-color="#e040fb"/>
<stop offset="100%" stop-color="#ff0080"/>
</linearGradient>
<filter id="neonGlow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<circle cx="60" cy="60" r="52" stroke="url(#ringGrad)" stroke-width="3" fill="none" filter="url(#neonGlow)" opacity=".9"/>
<circle cx="60" cy="60" r="44" stroke="url(#ringGrad)" stroke-width="1" fill="none" opacity=".4"/>
<polygon points="52,42 52,78 78,60" fill="#00f0ff" filter="url(#neonGlow)" opacity=".9"/>
<text x="60" y="105" text-anchor="middle" fill="#ff0080" font-size="22" font-weight="900" filter="url(#neonGlow)">−</text>
</svg>
<h1 class="menu-title-wrap"><span class="menu-title-play">Play</span><span class="menu-title-minus">Minus</span></h1>
<p class="menu-sub">Find the pair that matches the difference</p>
<button type="button" class="btn btn-primary" id="btnPlay">Play</button>
<div class="panel best-row">
<div class="best-label">Best Score</div>
<div class="best-value" id="menuBest">0</div>
</div>
</div>
</section>
<section id="game" class="screen game-screen">
<div class="game-top">
<div class="panel stat-panel">
<div class="stat-label">Score</div>
<div class="stat-value accent" id="scoreVal">0</div>
</div>
<div class="panel stat-panel">
<div class="stat-label">Time</div>
<div class="stat-value" id="timeVal">60</div>
</div>
<div class="panel stat-panel">
<div class="stat-label">Streak</div>
<div class="stat-value streak" id="streakVal">0</div>
</div>
</div>
<div class="game-body">
<div class="panel target-panel">
<div class="target-label">Find the difference</div>
<div class="target-num" id="targetVal">0</div>
</div>
<div class="panel hint-panel">Tap two numbers whose difference equals the target</div>
<div class="grid-wrap panel" style="padding:16px">
<div class="grid" id="numGrid"></div>
</div>
</div>
</section>
<section id="results" class="screen">
<div class="panel results-panel">
<h2 class="results-title">Round Complete</h2>
<div class="result-row"><span class="result-label">Final Score</span><span class="result-value highlight" id="resScore">0</span></div>
<div class="result-row"><span class="result-label">Correct</span><span class="result-value" id="resCorrect">0</span></div>
<div class="result-row"><span class="result-label">Wrong</span><span class="result-value" id="resWrong">0</span></div>
<div class="result-row"><span class="result-label">Accuracy</span><span class="result-value" id="resAccuracy">0%</span></div>
<div class="result-row"><span class="result-label">Best Score</span><span class="result-value gold" id="resBest">0</span></div>
<div class="results-btns">
<button type="button" class="btn btn-primary" id="btnAgain">Play Again</button>
<button type="button" class="btn btn-secondary" id="btnMenu">Main Menu</button>
</div>
</div>
</section>
<div class="feedback" id="feedback"></div>
</div>
<script>
(function(){
var PREFIX='pm_';
var ROUND_SEC=60;
var TARGET_MIN=2;
var TARGET_MAX=15;
var GRID_SIZE=9;
var state={screen:'menu',score:0,streak:0,correct:0,wrong:0,target:0,selected:null,numbers:[],timerId:null,timeLeft:ROUND_SEC,rafId:null,endTime:0};
function lsGet(k,d){try{var v=localStorage.getItem(PREFIX+k);return v!==null?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(PREFIX+k,JSON.stringify(v))}catch(e){}}
function $(id){return document.getElementById(id)}
function showScreen(name){
['menu','game','results'].forEach(function(s){
$(''+s).classList.toggle('active',s===name);
});
state.screen=name;
}
function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function shuffle(arr){
for(var i=arr.length-1;i>0;i--){
var j=randInt(0,i);
var t=arr[i];arr[i]=arr[j];arr[j]=t;
}
return arr;
}
function hasValidPair(nums,target){
for(var i=0;i<nums.length;i++){
for(var j=i+1;j<nums.length;j++){
if(Math.abs(nums[i]-nums[j])===target)return true;
}
}
return false;
}
function wouldCreatePair(a,b,target){
return Math.abs(a-b)===target;
}
function generateRound(){
var target=randInt(TARGET_MIN,TARGET_MAX);
var a=randInt(target+1,50);
var b=a-target;
var nums=[a,b];
var attempts=0;
while(nums.length<GRID_SIZE&&attempts<200){
attempts++;
var n=randInt(1,60);
if(nums.indexOf(n)!==-1)continue;
var ok=true;
for(var i=0;i<nums.length;i++){
if(wouldCreatePair(n,nums[i],target)&&!(nums[i]===a||nums[i]===b))ok=false;
}
if(ok)nums.push(n);
}
if(!hasValidPair(nums,target)){
return generateRound();
}
state.target=target;
state.numbers=shuffle(nums);
state.selected=null;
}
function renderGrid(){
var grid=$('numGrid');
grid.innerHTML='';
state.numbers.forEach(function(n,idx){
var btn=document.createElement('button');
btn.type='button';
btn.className='num-btn';
btn.textContent=n;
btn.dataset.idx=idx;
btn.addEventListener('click',onNumTap);
grid.appendChild(btn);
});
$('targetVal').textContent=state.target;
}
function updateStats(){
$('scoreVal').textContent=state.score;
$('streakVal').textContent=state.streak;
}
function showFeedback(msg,ok){
var el=$('feedback');
el.textContent=msg;
el.className='feedback show '+(ok?'ok':'bad');
setTimeout(function(){el.className='feedback';},600);
}
function onNumTap(e){
if(state.screen!=='game')return;
var idx=parseInt(e.currentTarget.dataset.idx,10);
var val=state.numbers[idx];
var btns=document.querySelectorAll('.num-btn');
if(state.selected===null){
state.selected=idx;
btns[idx].classList.add('selected');
return;
}
if(state.selected===idx){
state.selected=null;
btns[idx].classList.remove('selected');
return;
}
var first=state.numbers[state.selected];
var second=val;
var diff=Math.abs(first-second);
if(diff===state.target){
state.correct++;
state.streak++;
var bonus=Math.min(state.streak,5)*2;
state.score+=10+bonus;
btns[state.selected].classList.add('correct-flash');
btns[idx].classList.add('correct-flash');
showFeedback('+'+(10+bonus)+' Correct!',true);
updateStats();
setTimeout(function(){
generateRound();
renderGrid();
updateStats();
},400);
}else{
state.wrong++;
state.streak=0;
btns[state.selected].classList.add('wrong-flash');
btns[idx].classList.add('wrong-flash');
showFeedback('Try again!',false);
state.selected=null;
updateStats();
setTimeout(function(){
btns.forEach(function(b){b.classList.remove('selected','wrong-flash','correct-flash');});
},400);
}
}
function tickTimer(){
if(state.screen!=='game')return;
var now=Date.now();
var left=Math.max(0,Math.ceil((state.endTime-now)/1000));
state.timeLeft=left;
$('timeVal').textContent=left;
if(left<=0){
endRound();
return;
}
state.rafId=requestAnimationFrame(tickTimer);
}
function startRound(){
state.score=0;
state.streak=0;
state.correct=0;
state.wrong=0;
state.timeLeft=ROUND_SEC;
state.selected=null;
generateRound();
renderGrid();
updateStats();
$('timeVal').textContent=ROUND_SEC;
showScreen('game');
state.endTime=Date.now()+ROUND_SEC*1000;
if(state.rafId)cancelAnimationFrame(state.rafId);
state.rafId=requestAnimationFrame(tickTimer);
}
function endRound(){
if(state.rafId){cancelAnimationFrame(state.rafId);state.rafId=null;}
var total=state.correct+state.wrong;
var acc=total>0?Math.round(state.correct/total*100):0;
var best=lsGet('bestScore',0);
if(state.score>best){
best=state.score;
lsSet('bestScore',best);
}
lsSet('lastScore',state.score);
lsSet('lastCorrect',state.correct);
lsSet('lastWrong',state.wrong);
lsSet('lastAccuracy',acc);
$('resScore').textContent=state.score;
$('resCorrect').textContent=state.correct;
$('resWrong').textContent=state.wrong;
$('resAccuracy').textContent=acc+'%';
