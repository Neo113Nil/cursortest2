<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#1a0f08;color:#FFF8E7}
body{background:linear-gradient(160deg,#1a0f08 0%,#3d2314 40%,#2a1810 70%,#0d0805 100%);background-attachment:fixed}
.bg-pattern{position:fixed;inset:0;pointer-events:none;opacity:0.12;background-image:repeating-linear-gradient(0deg,transparent,transparent 24px,rgba(255,248,231,0.15) 24px,rgba(255,248,231,0.15) 25px),repeating-linear-gradient(90deg,transparent,transparent 24px,rgba(255,248,231,0.08) 24px,rgba(255,248,231,0.08) 25px)}
.screen{display:none;flex-direction:column;height:100%;width:100%;position:relative;z-index:1}
.screen.active{display:flex}
.topbar{padding:40px 20px 20px;flex-shrink:0}
.overlay{background:rgba(0,0,0,0.82);border-radius:14px;padding:16px 18px;border:1px solid rgba(255,248,231,0.25)}
.overlay-tight{background:rgba(0,0,0,0.82);border-radius:12px;padding:12px 14px;border:1px solid rgba(255,248,231,0.25)}
h1{font-size:28px;font-weight:800;color:#FFFFFF;letter-spacing:0.5px;line-height:1.2}
.subtitle{font-size:15px;font-weight:600;color:#FFF8E7;margin-top:8px;line-height:1.4}
.content{flex:1;overflow:hidden;padding:0 16px 16px;display:flex;flex-direction:column}
.menu-actions{display:flex;flex-direction:column;gap:14px;margin-top:8px;flex:1;justify-content:center;padding-bottom:24px}
.btn{display:flex;align-items:center;gap:14px;min-height:56px;width:100%;border:none;border-radius:14px;padding:14px 16px;font-size:17px;font-weight:700;color:#FFFFFF;background:rgba(0,0,0,0.82);border:1px solid rgba(212,160,80,0.55);cursor:pointer;text-align:left}
.btn:active{transform:scale(0.98);background:rgba(40,24,12,0.95)}
.btn-accent{background:rgba(120,70,20,0.92);border-color:rgba(255,200,90,0.75)}
.btn svg{flex-shrink:0;width:28px;height:28px}
.btn-label{display:flex;flex-direction:column;gap:2px}
.btn-title{font-size:17px;font-weight:800;color:#FFFFFF}
.btn-desc{font-size:13px;font-weight:600;color:#FFF8E7}
.results-body{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.search-wrap{flex-shrink:0}
.search-wrap input{width:100%;min-height:48px;border:none;border-radius:12px;padding:12px 14px;font-size:16px;font-weight:600;color:#FFFFFF;background:rgba(0,0,0,0.82);border:1px solid rgba(255,248,231,0.3);outline:none}
.search-wrap input::placeholder{color:#FFF8E7;opacity:1;font-weight:600}
.list-meta{font-size:13px;font-weight:700;color:#FFF8E7;padding:0 4px}
.list-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px}
.work-card{background:rgba(0,0,0,0.82);border-radius:12px;padding:14px 16px;margin-bottom:10px;border:1px solid rgba(255,248,231,0.22);cursor:pointer;min-height:64px}
.work-card:active{background:rgba(40,24,12,0.95)}
.work-title{font-size:16px;font-weight:800;color:#FFFFFF;line-height:1.3}
.work-author{font-size:14px;font-weight:600;color:#FFF8E7;margin-top:4px}
.work-meta{font-size:12px;font-weight:600;color:#FFE6B0;margin-top:6px}
.detail-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px}
.detail-panel{background:rgba(0,0,0,0.85);border-radius:14px;padding:18px;border:1px solid rgba(255,248,231,0.28)}
.detail-title{font-size:22px;font-weight:800;color:#FFFFFF;line-height:1.25}
.detail-author{font-size:16px;font-weight:700;color:#FFF8E7;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:rgba(90,50,15,0.95);border:1px solid rgba(255,200,90,0.5);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;color:#FFFFFF}
.section-label{font-size:13px;font-weight:800;color:#FFE6B0;margin-top:18px;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.6px}
.summary{font-size:15px;font-weight:600;color:#FFFFFF;line-height:1.55}
.quote{font-size:15px;font-weight:600;font-style:italic;color:#FFF8E7;line-height:1.5;padding:12px;background:rgba(60,35,15,0.9);border-radius:10px;border-left:4px solid #D4A050;margin-top:4px}
.bottom-bar{flex-shrink:0;padding:12px 16px 28px;display:flex;gap:10px}
.bottom-bar .btn{justify-content:center;text-align:center}
.hidden{display:none!important}
.lucky-badge{display:inline-block;background:rgba(160,90,20,0.95);border:1px solid rgba(255,200,90,0.6);color:#FFFFFF;font-size:11px;font-weight:800;padding:4px 10px;border-radius:10px;margin-bottom:10px;letter-spacing:0.4px}
</style>
</head>

<script>
var CATALOG=[{"id": 1, "title": "The Iliad", "author": "Homer", "year": "c. 8th century BCE", "country": "Ancient Greece", "genre": "Epic Poetry", "summary": "An epic poem set during the Trojan War, focusing on the wrath of Achilles and the clash of heroes. It explores honor, destiny, and the cost of pride amid gods and mortals.", "quote": "Sing, O goddess, the anger of Achilles son of Peleus."}, {"id": 2, "title": "The Odyssey", "author": "Homer", "year": "c. 8th century BCE", "country": "Ancient Greece", "genre": "Epic Poetry", "summary": "Odysseus journeys home after the Trojan War through trials of monsters, gods, and temptation. The poem celebrates cunning, loyalty, and the longing for home.", "quote": "Tell me, O Muse, of that ingenious hero who travelled far and wide."}, {"id": 3, "title": "The Aeneid", "author": "Virgil", "year": "c. 19 BCE", "country": "Ancient Rome", "genre": "Epic Poetry", "summary": "Aeneas flees fallen Troy and founds the line that will lead to Rome. Duty, piety, and empire intertwine in this foundational Latin epic.", "quote": "Fortune favors the bold."}, {"id": 4, "title": "Beowulf", "author": "Anonymous", "year": "c. 700-1000", "country": "England", "genre": "Epic Poetry", "summary": "A Geatish warrior defeats Grendel, Grendel's mother, and later a dragon. The poem blends heroic values with fate and the fragility of glory.", "quote": "Fate goes ever as fate must."}, {"id": 5, "title": "The Divine Comedy", "author": "Dante Alighieri", "year": "1320", "country": "Italy", "genre": "Epic Poetry", "summary": "Dante travels through Hell, Purgatory, and Paradise guided by Virgil and Beatrice. It maps sin, redemption, and divine love in vivid allegory.", "quote": "Abandon all hope, ye who enter here."}, {"id": 6, "title": "The Canterbury Tales", "author": "Geoffrey Chaucer", "year": "c. 1400", "country": "England", "genre": "Poetry / Frame Story", "summary": "Pilgrims share stories on the road to Canterbury, revealing medieval society in comedy and satire. Voices range from knights to millers in lively English.", "quote": "Whan that Aprille with his shoures soote."}, {"id": 7, "title": "Don Quixote", "author": "Miguel de Cervantes", "year": "1605", "country": "Spain", "genre": "Novel", "summary": "An aging gentleman becomes a knight-errant and chases impossible ideals with Sancho Panza. It invented the modern novel and mocked romantic illusion.", "quote": "Tilting at windmills."}, {"id": 8, "title": "Hamlet", "author": "William Shakespeare", "year": "1601", "country": "England", "genre": "Tragedy", "summary": "Prince Hamlet seeks revenge for his father's murder while wrestling with doubt and morality. Ambition, madness, and mortality collide at Elsinore.", "quote": "To be, or not to be, that is the question."}, {"id": 9, "title": "Macbeth", "author": "William Shakespeare", "year": "1606", "country": "England", "genre": "Tragedy", "summary": "Macbeth and Lady Macbeth seize the crown through murder and fall into paranoia and ruin. Ambition unchecked becomes a nightmare of blood and guilt.", "quote": "Out, damned spot!"}, {"id": 10, "title": "Romeo and Juliet", "author": "William Shakespeare", "year": "1597", "country": "England", "genre": "Tragedy", "summary": "Two young lovers from feuding families meet in Verona and defy fate. Passion and haste lead to an emblematic tragic ending.", "quote": "A rose by any other name would smell as sweet."}, {"id": 11, "title": "King Lear", "author": "William Shakespeare", "year": "1606", "country": "England", "genre": "Tragedy", "summary": "An aging king divides his kingdom and learns the cost of pride and blindness. Loyalty, betrayal, and storm reveal human fragility.", "quote": "How sharper than a serpent's tooth it is to have a thankless child."}, {"id": 12, "title": "Othello", "author": "William Shakespeare", "year": "1603", "country": "England", "genre": "Tragedy", "summary": "Iago's jealousy poisons Othello's love for Desdemona. Race, trust, and manipulation drive the tragedy to its end.", "quote": "O, beware, my lord, of jealousy."}, {"id": 13, "title": "Paradise Lost", "author": "John Milton", "year": "1667", "country": "England", "genre": "Epic Poetry", "summary": "Milton retells the Fall of Man with Satan's rebellion and Adam and Eve's exile. Free will, pride, and obedience stand at the poem's core.", "quote": "Better to reign in Hell than serve in Heaven."}, {"id": 14, "title": "Gulliver's Travels", "author": "Jonathan Swift", "year": "1726", "country": "Ireland", "genre": "Satire", "summary": "Gulliver visits tiny, giant, and strange lands that mirror Europe's follies. Travel narrative becomes a sharp satire of politics and human nature.", "quote": "I cannot but conclude the bulk of your natives to be the most pernicious race of little odious vermin."}, {"id": 15, "title": "Robinson Crusoe", "author": "Daniel Defoe", "year": "1719", "country": "England", "genre": "Adventure Novel", "summary": "A castaway builds a life alone on an island and confronts survival and faith. Often called a foundational English novel of individualism.", "quote": "I was born in the year 1632, in the city of York."}, {"id": 16, "title": "Pride and Prejudice", "author": "Jane Austen", "year": "1813", "country": "England", "genre": "Romance / Social Novel", "summary": "Elizabeth Bennet and Mr. Darcy navigate pride, prejudice, and marriage markets. Wit and social observation define this beloved classic.", "quote": "It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife."}, {"id": 17, "title": "Sense and Sensibility", "author": "Jane Austen", "year": "1811", "country": "England", "genre": "Romance / Social Novel", "summary": "The Dashwood sisters balance feeling and reason after sudden loss of fortune. Love and restraint are tested in Regency England.", "quote": "Know your own happiness. You want nothing but patience."}, {"id": 18, "title": "Emma", "author": "Jane Austen", "year": "1815", "country": "England", "genre": "Romance / Social Novel", "summary": "Emma Woodhouse meddles in matchmaking until her own heart confounds her. Comic errors reveal self-knowledge and kindness.", "quote": "Silly things do cease to be silly if they are done by sensible people in an impudent way."}, {"id": 19, "title": "Frankenstein", "author": "Mary Shelley", "year": "1818", "country": "England", "genre": "Gothic / Science Fiction", "summary": "Victor Frankenstein creates life and abandons his Creature, breeding tragedy. Ambition, isolation, and responsibility haunt the novel.", "quote": "I ought to be thy Adam, but I am rather the fallen angel."}, {"id": 20, "title": "Wuthering Heights", "author": "Emily Bronte", "year": "1847", "country": "England", "genre": "Gothic Romance", "summary": "Heathcliff and Catherine's fierce love scars generations on the moors. Passion, revenge, and class fuse in a stormy narrative.", "quote": "Whatever our souls are made of, his and mine are the same."}, {"id": 21, "title": "Jane Eyre", "author": "Charlotte Bronte", "year": "1847", "country": "England", "genre": "Novel", "summary": "An orphan governess seeks independence and love while confronting secrets at Thornfield. Moral courage and equality shape her voice.", "quote": "I am no bird; and no net ensnares me."}, {"id": 22, "title": "Great Expectations", "author": "Charles Dickens", "year": "1861", "country": "England", "genre": "Novel", "summary": "Pip rises from poverty with mysterious patronage and learns what true gentility means. Class, guilt, and redemption frame his growth.", "quote": "I loved her against reason, against promise, against peace."}, {"id": 23, "title": "A Tale of Two Cities", "author": "Charles Dickens", "year": "1859", "country": "England", "genre": "Historical Novel", "summary": "Sacrifice and revolution collide in London and Paris during the French Revolution. Love and resurrection are themes of this sweeping tale.", "quote": "It was the best of times, it was the worst of times."}, {"id": 24, "title": "Oliver Twist", "author": "Charles Dickens", "year": "1838", "country": "England", "genre": "Novel", "summary": "An orphan survives workhouses and crime in London's underworld. Dickens exposes social cruelty with pathos and melodrama.", "quote": "Please, sir, I want some more."}, {"id": 25, "title": "Moby-Dick", "author": "Herman Melville", "year": "1851", "country": "United States", "genre": "Adventure / Philosophical Novel", "summary": "Captain Ahab hunts the white whale that maimed him, dragging his crew toward doom. Obsession, nature, and meaning fill this oceanic epic.", "quote": "Call me Ishmael."}, {"id": 26, "title": "The Scarlet Letter", "author": "Nathaniel Hawthorne", "year": "1850", "country": "United States", "genre": "Historical Novel", "summary": "Hester Prynne bears public shame in Puritan New England while secret guilt corrodes others. Sin, hypocrisy, and identity are central.", "quote": "Be true! Be true! Be true!"}, {"id": 27, "title": "Walden", "author": "Henry David Thoreau", "year": "1854", "country": "United States", "genre": "Essay / Memoir", "summary": "Thoreau recounts living simply by Walden Pond and reflecting on society and nature. Self-reliance and deliberate living inspire generations.", "quote": "I went to the woods because I wished to live deliberately."}, {"id": 28, "title": "Leaves of Grass", "author": "Walt Whitman", "year": "1855", "country": "United States", "genre": "Poetry", "summary": "Whitman celebrates the body, democracy, and the self in free verse. The collection reinvented American poetry's voice and form.", "quote": "I celebrate myself, and sing myself."}, {"id": 29, "title": "Crime and Punishment", "author": "Fyodor Dostoevsky", "year": "1866", "country": "Russia", "genre": "Psychological Novel", "summary": "Raskolnikov murders and then wrestles with conscience, ideology, and redemption. Guilt becomes a philosophical and spiritual drama.", "quote": "Pain and suffering are always inevitable for a large intelligence and a deep heart."}, {"id": 30, "title": "The Brothers Karamazov", "author": "Fyodor Dostoevsky", "year": "1880", "country": "Russia", "genre": "Philosophical Novel", "summary": "Three brothers confront faith, doubt, and patricide in a small Russian town. Free will and moral responsibility explode in courtroom and soul.", "quote": "If God does not exist, everything is permitted."}, {"id": 31, "title": "War and Peace", "author": "Leo Tolstoy", "year": "1869", "country": "Russia", "genre": "Historical Novel", "summary": "Aristocratic lives intertwine with Napoleon's invasion of Russia. History, love, and chance are contemplated on a vast canvas.", "quote": "We can know only that we know nothing. And that is the highest degree of human wisdom."}, {"id": 32, "title": "Anna Karenina", "author": "Leo Tolstoy", "year": "1878", "country": "Russia", "genre": "Novel", "summary": "Anna's affair with Vronsky collides with social convention while Levin seeks meaning in work and marriage. Passion and family life contrast sharply.", "quote": "All happy families are alike; each unhappy family is unhappy in its own way."}, {"id": 33, "title": "Madame Bovary", "author": "Gustave Flaubert", "year": "1857", "country": "France", "genre": "Realist Novel", "summary": "Emma Bovary chases romantic fantasy beyond provincial life and pays a bitter price. Style and realism redefine the novel.", "quote": "She wanted to die, but she also wanted to live in Paris."}, {"id": 34, "title": "Les Miserables", "author": "Victor Hugo", "year": "1862", "country": "France", "genre": "Historical Novel", "summary": "Jean Valjean seeks redemption while Javert pursues justice through poverty and revolution. Mercy, law, and social misery dominate the epic.", "quote": "It is nothing to die. It is frightful not to live."}, {"id": 35, "title": "The Count of Monte Cristo", "author": "Alexandre Dumas", "year": "1844", "country": "France", "genre": "Adventure Novel", "summary": "Edmond Dantes escapes wrongful imprisonment and crafts elaborate revenge. Fortune, justice, and forgiveness fuel this thriller.", "quote": "All human wisdom is contained in these two words: Wait and Hope."}, {"id": 36, "title": "The Three Musketeers", "author": "Alexandre Dumas", "year": "1844", "country": "France", "genre": "Adventure Novel", "summary": "D'Artagnan joins Athos, Porthos, and Aramis in intrigues of court and sword. Friendship and royal plots drive swashbuckling fun.", "quote": "All for one and one for all."}, {"id": 37, "title": "Candide", "author": "Voltaire", "year": "1759", "country": "France", "genre": "Satire", "summary": "Candide's optimistic worldview is smashed by endless disasters and hypocrisy. Voltaire skewers philosophy and institutions with ruthless wit.", "quote": "We must cultivate our garden."}, {"id": 38, "title": "Faust", "author": "Johann Wolfgang von Goethe", "year": "1808", "country": "Germany", "genre": "Drama / Tragedy", "summary": "Faust bargains with Mephistopheles for knowledge and experience beyond limits. Ambition, love, and salvation frame the legendary pact.", "quote": "Two souls, alas, are dwelling in my breast."}, {"id": 39, "title": "The Metamorphosis", "author": "Franz Kafka", "year": "1915", "country": "Austria-Hungary", "genre": "Novella", "summary": "Gregor Samsa wakes as a giant insect and faces family alienation. Absurd horror becomes a parable of modern isolation.", "quote": "As Gregor Samsa awoke one morning from uneasy dreams he found himself transformed in his bed into a gigantic insect."}, {"id": 40, "title": "The Trial", "author": "Franz Kafka", "year": "1925", "country": "Austria-Hungary", "genre": "Novel", "summary": "Josef K. is arrested by an opaque court for a crime never explained. Bureaucracy and guilt spiral into existential dread.", "quote": "Someone must have been telling lies about Josef K."}, {"id": 41, "title": "Ulysses", "author": "James Joyce", "year": "1922", "country": "Ireland", "genre": "Modernist Novel", "summary": "One day in Dublin mirrors Homer's Odyssey through Bloom, Stephen, and Molly. Language experimentation remakes the novel itself.", "quote": "Yes I said yes I will Yes."}, {"id": 42, "title": "A Portrait of the Artist as a Young Man", "author": "James Joyce", "year": "1916", "country": "Ireland", "genre": "Modernist Novel", "summary": "Stephen Dedalus grows into an artist breaking free of church and nation. Epiphany and exile mark his awakening.", "quote": "I go to encounter for the millionth time the reality of experience."}, {"id": 43, "title": "Mrs Dalloway", "author": "Virginia Woolf", "year": "1925", "country": "England", "genre": "Modernist Novel", "summary": "Clarissa Dalloway prepares a party while Septimus Smith's war trauma unfolds across London. Time and consciousness flow in luminous streams.", "quote": "Mrs. Dalloway said she would buy the flowers herself."}, {"id": 44, "title": "To the Lighthouse", "author": "Virginia Woolf", "year": "1927", "country": "England", "genre": "Modernist Novel", "summary": "The Ramsay family and guests circle memory, art, and loss around a promised voyage. Perception shifts like light on water.", "quote": "What is the meaning of life? That was all—a simple question."}, {"id": 45, "title": "The Great Gatsby", "author": "F. Scott Fitzgerald", "year": "1925", "country": "United States", "genre": "Novel", "summary": "Jay Gatsby pursues love and the American Dream across the Jazz Age. Wealth and illusion glitter then shatter.", "quote": "So we beat on, boats against the current, borne back ceaselessly into the past."}, {"id": 46, "title": "The Sun Also Rises", "author": "Ernest Hemingway", "year": "1926", "country": "United States", "genre": "Novel", "summary": "Expatriates drift through Paris and Spain after World War I. Lost generation ennui is rendered in spare prose.", "quote": "Isn't it pretty to think so?"}, {"id": 47, "title": "Farewell to Arms", "author": "Ernest Hemingway", "year": "1929", "country": "United States", "genre": "War Novel", "summary": "An ambulance driver and a nurse find love amid the Italian front. War's chaos strips romance of certainty.", "quote": "The world breaks every one and afterward many are strong at the broken places."}, {"id": 48, "title": "The Old Man and the Sea", "author": "Ernest Hemingway", "year": "1952", "country": "United States", "genre": "Novella", "summary": "An aging fisherman battles a giant marlin in a contest of endurance. Dignity and defeat blend in Hemingway's pared style.", "quote": "A man can be destroyed but not defeated."}, {"id": 49, "title": "1984", "author": "George Orwell", "year": "1949", "country": "United Kingdom", "genre": "Dystopian Novel", "summary": "Winston Smith resists Big Brother's surveillance state until thought itself is crushed. Totalitarian language and power define the nightmare.", "quote": "Big Brother is watching you."}, {"id": 50, "title": "Animal Farm", "author": "George Orwell", "year": "1945", "country": "United Kingdom", "genre": "Allegory / Satire", "summary": "Farm animals overthrow their master only to reinvent tyranny. Revolution's betrayal is told with fable clarity.", "quote": "All animals are equal, but some animals are more equal than others."}, {"id": 51, "title": "Brave New World", "author": "Aldous Huxley", "year": "1932", "country": "United Kingdom", "genre": "Dystopian Novel", "summary": "A engineered pleasure society extinguishes individuality and history. Freedom collides with comfort in a chilling future.", "quote": "Ending is better than mending."}, {"id": 52, "title": "Lord of the Flies", "author": "William Golding", "year": "1954", "country": "United Kingdom", "genre": "Novel", "summary": "Stranded boys build then destroy a fragile society on an island. Civilization's thin veneer cracks under fear.", "quote": "The thing is—fear can't hurt you any more than a dream."}, {"id": 53, "title": "The Catcher in the Rye", "author": "J. D. Salinger", "year": "1951", "country": "United States", "genre": "Novel", "summary": "Holden Caulfield wanders New York after leaving school, rejecting adult phoniness. Adolescent alienation speaks in a raw voice.", "quote": "Don't ever tell anybody anything. If you do, you start missing everybody."}, {"id": 54, "title": "To Kill a Mockingbird", "author": "Harper Lee", "year": "1960", "country": "United States", "genre": "Novel", "summary": "Scout Finch watches her father defend a black man in racially divided Alabama. Childhood innocence meets injustice.", "quote": "You never really understand a person until you consider things from his point of view."}, {"id": 55, "title": "One Hundred Years of Solitude", "author": "Gabriel Garcia Marquez", "year": "1967", "country": "Colombia", "genre": "Magical Realism", "summary": "The Buendia family saga unfolds across generations in mythical Macondo. Magic and history interweave in Latin American epic.", "quote": "Many years later, as he faced the firing squad, Colonel Aureliano Buendia was to remember that distant afternoon when his father took him to discover ice."}, {"id": 56, "title": "Love in the Time of Cholera", "author": "Gabriel Garcia Marquez", "year": "1985", "country": "Colombia", "genre": "Romance Novel", "summary": "Florentino Ariza waits decades for Fermina Daza amid love's follies and endurance. Passion ages without surrendering desire.", "quote": "The only regret I will have in dying is if it is not for love."}, {"id": 57, "title": "The Stranger", "author": "Albert Camus", "year": "1942", "country": "France / Algeria", "genre": "Philosophical Novel", "summary": "Meursault commits a senseless murder and faces absurd justice with detached honesty. Meaninglessness meets sunlight and death.", "quote": "Mother died today. Or maybe yesterday; I can't be sure."}, {"id": 58, "title": "The Plague", "author": "Albert Camus", "year": "1947", "country": "France", "genre": "Philosophical Novel", "summary": "Oran endures a bubonic plague that tests solidarity and indifference. Epidemic becomes allegory of resistance.", "quote": "I have no idea what's awaiting me, or what will happen when this all ends. For the moment I know this: there are sick people and they need curing."}, {"id": 59, "title": "Nausea", "author": "Jean-Paul Sartre", "year": "1938", "country": "France", "genre": "Philosophical Novel", "summary": "Antoine Roquentin confronts existence as contingent and nauseating. Existential dread saturates ordinary objects.", "quote": "I exist, that is all."}, {"id": 60, "title": "Things Fall Apart", "author": "Chinua Achebe", "year": "1958", "country": "Nigeria", "genre": "Novel", "summary": "Okonkwo's world in Igbo society fractures under colonial pressure. Tradition and change collide with tragic force.", "quote": "The white man is very clever. He came quietly and peaceably with his religion."}, {"id": 61, "title": "Beloved", "author": "Toni Morrison", "year": "1987", "country": "United States", "genre": "Historical Novel", "summary": "Sethe is haunted by slavery's trauma and a ghostly daughter. Memory and motherhood fuse in lyric power.", "quote": "Freeing yourself was one thing, claiming ownership of that freed self was another."}, {"id": 62, "title": "Invisible Man", "author": "Ralph Ellison", "year": "1952", "country": "United States", "genre": "Novel", "summary": "An unnamed black narrator navigates invisibility in racist America. Identity, ideology, and underground exile shape his journey.", "quote": "I am an invisible man."}, {"id": 63, "title": "The Sound and the Fury", "author": "William Faulkner", "year": "1929", "country": "United States", "genre": "Modernist Novel", "summary": "The Compson family's decline unfolds through fractured perspectives. Time and consciousness splinter in Southern gothic form.", "quote": "I give you the mausoleum of all hope and desire."}, {"id": 64, "title": "As I Lay Dying", "author": "William Faulkner", "year": "1930", "country": "United States", "genre": "Modernist Novel", "summary": "The Bundren family carts Addie's body to her burial ground amid mishaps. Multiple voices create a chorus of motive and grief.", "quote": "My mother is a fish."}, {"id": 65, "title": "Heart of Darkness", "author": "Joseph Conrad", "year": "1899", "country": "United Kingdom / Poland", "genre": "Novella", "summary": "Marlow steams up the Congo River toward Kurtz and colonial horror. Civilization's veneer thins in the jungle.", "quote": "The horror! The horror!"}, {"id": 66, "title": "Lord Jim", "author": "Joseph Conrad", "year": "1900", "country": "United Kingdom / Poland", "genre": "Novel", "summary": "Jim seeks redemption after abandoning a ship of pilgrims. Honor and guilt shadow him across oceans.", "quote": "There is something peculiar in a small boat upon the wide sea."}, {"id": 67, "title": "Dracula", "author": "Bram Stoker", "year": "1897", "country": "Ireland", "genre": "Gothic Horror", "summary": "Count Dracula brings ancient bloodlust into Victorian England. Letters and diaries assemble a modern vampire myth.", "quote": "Listen to them, the children of the night. What music they make!"}, {"id": 68, "title": "The Picture of Dorian Gray", "author": "Oscar Wilde", "year": "1890", "country": "Ireland", "genre": "Gothic / Philosophical Novel", "summary": "Dorian's portrait ages with his sins while his face stays young. Beauty, corruption, and aestheticism intertwine.", "quote": "The only way to get rid of a temptation is to yield to it."}, {"id": 69, "title": "Alice's Adventures in Wonderland", "author": "Lewis Carroll", "year": "1865", "country": "England", "genre": "Fantasy / Children's Literature", "summary": "Alice tumbles underground into logic-bending nonsense and strange creatures. Childhood curiosity meets absurd rules.", "quote": "Curiouser and curiouser!"}, {"id": 70, "title": "Through the Looking-Glass", "author": "Lewis Carroll", "year": "1871", "country": "England", "genre": "Fantasy / Children's Literature", "summary": "Alice enters a chessboard world of mirror logic and queens. Wordplay and riddles create reverse-world wonder.", "quote": "It's a poor sort of memory that only works backwards."}, {"id": 71, "title": "The Adventures of Huckleberry Finn", "author": "Mark Twain", "year": "1884", "country": "United States", "genre": "Novel", "summary": "Huck and Jim raft down the Mississippi fleeing bondage and hypocrisy. Conscience and freedom define the American classic.", "quote": "All right, then, I'll go to hell."}, {"id": 72, "title": "The Adventures of Tom Sawyer", "author": "Mark Twain", "year": "1876", "country": "United States", "genre": "Novel", "summary": "Tom's mischief and river-town adventures capture boyhood imagination. Friendship and treasure myths sparkle with humor.", "quote": "Work consists of whatever a body is obliged to do."}, {"id": 73, "title": "Uncle Tom's Cabin", "author": "Harriet Beecher Stowe", "year": "1852", "country": "United States", "genre": "Novel", "summary": "The brutal system of slavery is shown through Tom and others' fates. The novel galvanized abolitionist feeling.", "quote": "I will be free or die!"}, {"id": 74, "title": "Little Women", "author": "Louisa May Alcott", "year": "1868", "country": "United States", "genre": "Novel", "summary": "The March sisters grow up amid love, work, and ambition during the Civil War era. Family bonds shape their choices.", "quote": "I am not afraid of storms, for I am learning how to sail my ship."}, {"id": 75, "title": "The Call of the Wild", "author": "Jack London", "year": "1903", "country": "United States", "genre": "Adventure Novel", "summary": "Buck the dog is thrust into Yukon hardship and rediscovers primal instinct. Nature and civilization clash in snow.", "quote": "He was sounding the deeps of his nature, and of the parts of his nature that were deeper than he."}, {"id": 76, "title": "White Fang", "author": "Jack London", "year": "1906", "country": "United States", "genre": "Adventure Novel", "summary": "A wild wolf-dog moves from wilderness brutality toward human trust. Survival softens into belonging.", "quote": "Fear urged him to go back, but growth drove him on."}, {"id": 77, "title": "Siddhartha", "author": "Hermann Hesse", "year": "1922", "country": "Germany", "genre": "Philosophical Novel", "summary": "Siddhartha seeks enlightenment beyond teachers, through river and experience. Spiritual quest becomes personal discovery.", "quote": "I can think. I can wait. I can fast."}, {"id": 78, "title": "Steppenwolf", "author": "Hermann Hesse", "year": "1927", "country": "Germany", "genre": "Novel", "summary": "Harry Haller wrestles with dual nature as man and wolf amid modern alienation. The Magic Theater opens inward.", "quote": "I am a wolf of the steppes."}, {"id": 79, "title": "The Magic Mountain", "author": "Thomas Mann", "year": "1924", "country": "Germany", "genre": "Philosophical Novel", "summary": "Hans Castorp spends years in a Swiss sanatorium debating life, death, and ideas. Time dilates before world war.", "quote": "Time has no divisions to mark its passage."}, {"id": 80, "title": "Death in Venice", "author": "Thomas Mann", "year": "1912", "country": "Germany", "genre": "Novella", "summary": "Aging writer Aschenbach becomes obsessed with beauty in plague-touched Venice. Desire and decline intertwine.", "quote": "Solitude gives birth to the original in us."}, {"id": 81, "title": "The Tin Drum", "author": "Gunter Grass", "year": "1959", "country": "Germany", "genre": "Novel", "summary": "Oskar Matzerath stops growing and drums through Nazi-era Danzig. Grotesque satire meets historical memory.", "quote": "I remained the three-year-old."}, {"id": 82, "title": "Ficciones", "author": "Jorge Luis Borges", "year": "1944", "country": "Argentina", "genre": "Short Stories", "summary": "Labyrinths, mirrors, and infinite libraries populate speculative tales. Ideas become dazzling puzzles.", "quote": "I have always imagined that Paradise will be a kind of library."}, {"id": 83, "title": "Pedro Paramo", "author": "Juan Rulfo", "year": "1955", "country": "Mexico", "genre": "Novel", "summary": "A son seeks his father in a ghost town of whispers and the dead. Mexican modernism meets spectral realism.", "quote": "I came to Comala because I had been told that my father, a man named Pedro Paramo, lived there."}, {"id": 84, "title": "The Tale of Genji", "author": "Murasaki Shikibu", "year": "c. 1008", "country": "Japan", "genre": "Novel", "summary": "Prince Genji's loves and court life unfold in Heian Japan. Often called the world's first novel.", "quote": "The world knows nothing, but you."}, {"id": 85, "title": "The Book of Job", "author": "Anonymous / Biblical", "year": "c. 6th-4th century BCE", "country": "Ancient Near East", "genre": "Religious Literature", "summary": "Job endures catastrophic suffering and questions divine justice. Faith confronts mystery without easy answers.", "quote": "The Lord gave, and the Lord hath taken away."}, {"id": 86, "title": "The Epic of Gilgamesh", "author": "Anonymous", "year": "c. 2100-1200 BCE", "country": "Mesopotamia", "genre": "Epic Poetry", "summary": "King Gilgamesh seeks immortality after losing his friend Enkidu. Friendship and mortality mark humanity's earliest epic.", "quote": "He who saw everything to the ends of the land."}, {"id": 87, "title": "Medea", "author": "Euripides", "year": "431 BCE", "country": "Ancient Greece", "genre": "Tragedy", "summary": "Betrayed Medea takes terrible revenge on Jason. Passion and justice collide in Greek tragedy's fury.", "quote": "Of all creatures that can feel and think, we women are the worst treated things alive."}, {"id": 88, "title": "Oedipus Rex", "author": "Sophocles", "year": "c. 429 BCE", "country": "Ancient Greece", "genre": "Tragedy", "summary": "Oedipus seeks a murderer and discovers his own cursed fate. Knowledge destroys ignorance with tragic irony.", "quote": "How dreadful knowledge of the truth can be when there's no help in truth."}, {"id": 89, "title": "Antigone", "author": "Sophocles", "year": "c. 441 BCE", "country": "Ancient Greece", "genre": "Tragedy", "summary": "Antigone defies Creon's law to bury her brother. Duty to family wars with the state.", "quote": "I was born to join in love, not hate—that is my nature."}, {"id": 90, "title": "The Republic", "author": "Plato", "year": "c. 380 BCE", "country": "Ancient Greece", "genre": "Philosophy", "summary": "Socrates debates justice, the ideal state, and the cave of illusion. Philosophy's classic dialogue on truth and power.", "quote": "The unexamined life is not worth living."}, {"id": 91, "title": "The Prince", "author": "Niccolo Machiavelli", "year": "1532", "country": "Italy", "genre": "Political Treatise", "summary": "A realist guide to acquiring and keeping power. Politics strips idealism bare.", "quote": "It is better to be feared than loved, if you cannot be both."}, {"id": 92, "title": "Utopia", "author": "Thomas More", "year": "1516", "country": "England", "genre": "Political Fiction", "summary": "An imagined island society critiques European greed and law. Ideal order is described with ironic distance.", "quote": "Anyone who campaigns for public office becomes disqualified for holding one."}, {"id": 93, "title": "Tess of the d'Urbervilles", "author": "Thomas Hardy", "year": "1891", "country": "England", "genre": "Novel", "summary": "Tess Durbeyfield suffers social hypocrisy after tragedy and love. Fate and purity are bitterly contested.", "quote": "Justice was done, and the President of the Immortals had ended his sport with Tess."}, {"id": 94, "title": "Jude the Obscure", "author": "Thomas Hardy", "year": "1895", "country": "England", "genre": "Novel", "summary": "Jude Fawley's ambitions and love are crushed by class and convention. Hardy's bleakest protest novel.", "quote": "Done because we are too menny."}, {"id": 95, "title": "Vanity Fair", "author": "William Makepeace Thackeray", "year": "1848", "country": "England", "genre": "Novel", "summary": "Becky Sharp climbs society with wit and ruthlessness while Amelia represents softer virtue. A novel without a hero.", "quote": "The world is a looking-glass, and gives back to every man the reflection of his own face."}, {"id": 96, "title": "Middlemarch", "author": "George Eliot", "year": "1872", "country": "England", "genre": "Novel", "summary": "Provincial lives interconnect around idealism, marriage, and reform. Moral realism at its richest.", "quote": "It is a narrow mind which cannot look at a subject from various points of view."}, {"id": 97, "title": "The Idiot", "author": "Fyodor Dostoevsky", "year": "1869", "country": "Russia", "genre": "Philosophical Novel", "summary": "Prince Myshkin's Christian simplicity collides with a cynical society. Innocence meets passion and ruin.", "quote": "Beauty will save the world."}, {"id": 98, "title": "Notes from Underground", "author": "Fyodor Dostoevsky", "year": "1864", "country": "Russia", "genre": "Philosophical Novella", "summary": "A bitter underground man rails against rational Utopias and free will. Modern consciousness speaks in spite.", "quote": "I am a sick man... I am a spiteful man."}, {"id": 99, "title": "Dead Souls", "author": "Nikolai Gogol", "year": "1842", "country": "Russia", "genre": "Satirical Novel", "summary": "Chichikov buys dead serfs' names in a scheme exposing Russian provincial life. Comic grotesque meets social critique.", "quote": "Rus, what do you want of me?"}, {"id": 100, "title": "The Cherry Orchard", "author": "Anton Chekhov", "year": "1904", "country": "Russia", "genre": "Drama", "summary": "An aristocratic family loses its estate as a new order rises. Change arrives with laughter and quiet sorrow.", "quote": "All Russia is our orchard."}];
var LS_PREFIX="lr_";
var state={mode:"list",filtered:null,focusSearch:false,isLucky:false};
var listEls={scroll:null,meta:null,renderToken:0};
function saveLastLucky(id){try{localStorage.setItem(LS_PREFIX+"lastLucky",String(id));}catch(e){}}
function pushRecent(id){
try{
var raw=localStorage.getItem(LS_PREFIX+"recent");
var arr=raw?JSON.parse(raw):[];
arr=arr.filter(function(x){return x!==id;});
arr.unshift(id);
if(arr.length>20)arr=arr.slice(0,20);
localStorage.setItem(LS_PREFIX+"recent",JSON.stringify(arr));
}catch(e){}
}
function showScreen(name){
document.getElementById("screen-menu").classList.toggle("active",name==="menu");
document.getElementById("screen-results").classList.toggle("active",name==="results");
}
function escapeHtml(s){
return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function openList(opts){
opts=opts||{};
state.mode="list";
state.isLucky=false;
state.focusSearch=!!opts.focusSearch;
state.filtered=CATALOG.slice();
document.getElementById("results-heading").textContent=opts.focusSearch?"Search":"Browse All";
document.getElementById("results-sub").textContent=CATALOG.length+" classic works";
document.getElementById("search-wrap").classList.remove("hidden");
document.getElementById("list-meta").classList.remove("hidden");
document.getElementById("list-scroll").classList.remove("hidden");
document.getElementById("detail-scroll").classList.add("hidden");
document.getElementById("btn-again").classList.add("hidden");
var input=document.getElementById("search-input");
input.value=opts.query||"";
applyFilter(input.value);
showScreen("results");
if(state.focusSearch){setTimeout(function(){input.focus();},80);}
}
function applyFilter(q){
q=(q||"").trim().toLowerCase();
if(!q){state.filtered=CATALOG.slice();}
else{
state.filtered=CATALOG.filter(function(w){
return w.title.toLowerCase().indexOf(q)>=0||w.author.toLowerCase().indexOf(q)>=0||w.genre.toLowerCase().indexOf(q)>=0||w.country.toLowerCase().indexOf(q)>=0;
});
}
document.getElementById("list-meta").textContent=state.filtered.length+" result"+(state.filtered.length===1?"":"s");
renderList();
}
function renderList(){
var scroll=document.getElementById("list-scroll");
listEls.scroll=scroll;
listEls.meta=document.getElementById("list-meta");
listEls.renderToken++;
var token=listEls.renderToken;
var items=state.filtered||[];
var PAGE=40;
var shown=Math.min(PAGE,items.length);
function paint(n){
if(token!==listEls.renderToken)return;
var html="";
for(var i=0;i<n;i++){
var w=items[i];
html+='<div class="work-card" data-id="'+w.id+'"><div class="work-title">'+escapeHtml(w.title)+'</div><div class="work-author">'+escapeHtml(w.author)+'</div><div class="work-meta">'+escapeHtml(w.year)+" · "+escapeHtml(w.country)+" · "+escapeHtml(w.genre)+"</div></div>";
}
if(n<items.length){
html+='<div class="work-card" id="load-more" style="text-align:center"><div class="work-title">Load more</div><div class="work-author">'+(items.length-n)+" remaining</div></div>";
}
scroll.innerHTML=html;
}
paint(shown);
scroll.onclick=function(e){
var card=e.target.closest(".work-card");
if(!card)return;
if(card.id==="load-more"){
shown=Math.min(shown+PAGE,items.length);
paint(shown);
return;
}
var id=parseInt(card.getAttribute("data-id"),10);
var work=CATALOG.find(function(w){return w.id===id;});
if(work)openDetail(work,false);
};
}
function openDetail(work,isLucky){
state.mode="detail";
state.isLucky=!!isLucky;
pushRecent(work.id);
if(isLucky)saveLastLucky(work.id);
document.getElementById("results-heading").textContent=isLucky?"Lucky Pick":"Work Detail";
document.getElementById("results-sub").textContent=work.author;
document.getElementById("search-wrap").classList.add("hidden");
document.getElementById("list-meta").classList.add("hidden");
document.getElementById("list-scroll").classList.add("hidden");
document.getElementById("detail-scroll").classList.remove("hidden");
document.getElementById("btn-again").classList.toggle("hidden",!isLucky);
var badge=isLucky?'<div class="lucky-badge">LUCKY PICK</div>':"";
var quote=work.quote?'<div class="section-label">Notable line</div><div class="quote">"'+escapeHtml(work.quote)+'"</div>':"";
document.getElementById("detail-scroll").innerHTML='<div class="detail-panel">'+badge+'<div class="detail-title">'+escapeHtml(work.title)+'</div><div class="detail-author">'+escapeHtml(work.author)+'</div><div class="chips"><span class="chip">'+escapeHtml(work.year)+'</span><span class="chip">'+escapeHtml(work.country)+'</span><span class="chip">'+escapeHtml(work.genre)+'</span></div><div class="section-label">About</div><p class="summary">'+escapeHtml(work.summary)+'</p>'+quote+"</div>";
showScreen("results");
}
function luckyPick(){
var i=Math.floor(Math.random()*CATALOG.length);
openDetail(CATALOG[i],true);
}
var searchTimer=null;
document.getElementById("btn-browse").addEventListener("click",function(){openList({focusSearch:false});});
document.getElementById("btn-lucky").addEventListener("click",luckyPick);
document.getElementById("btn-search").addEventListener("click",function(){openList({focusSearch:true});});
document.getElementById("btn-back").addEventListener("click",function(){showScreen("menu");});
document.getElementById("btn-again").addEventListener("click",luckyPick);
document.getElementById("search-input").addEventListener("input",function(e){
var v=e.target.value;
clearTimeout(searchTimer);
searchTimer=setTimeout(function(){applyFilter(v);},300);
});
</script>
</body>
</html>
