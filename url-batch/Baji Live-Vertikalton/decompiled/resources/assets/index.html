<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Play Wall</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--pink:#ff2ea8;--magenta:#e400ff;--cyan:#00e5ff;--blue:#0088ff;--bg0:#030612;--bg1:#0a0820;--bg2:#120828}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg0);font-family:system-ui,-apple-system,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
#app{width:100%;height:100%;position:relative;background:radial-gradient(ellipse 120% 80% at 50% 40%,#1a0a3a 0%,var(--bg1) 45%,var(--bg0) 100%)}
.scene-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.scene-rays{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,transparent 0deg 7deg,rgba(255,46,168,.05) 7deg 8deg,transparent 8deg 16deg,rgba(0,229,255,.04) 16deg 17deg);animation:spin 80s linear infinite}
.scene-streaks{position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(255,46,168,.08) 20%,transparent 40%,rgba(0,229,255,.1) 60%,transparent 80%,rgba(255,46,168,.06) 100%);filter:blur(28px);opacity:.85;animation:drift 8s ease-in-out infinite alternate}
.scene-rings{position:absolute;top:50%;left:50%;width:min(92vw,420px);height:min(92vw,420px);transform:translate(-50%,-58%)}
.scene-rings svg{width:100%;height:100%;opacity:.55}
.scene-play-icon{position:absolute;top:50%;left:50%;width:min(70vw,300px);height:min(70vw,300px);transform:translate(-50%,-62%);opacity:.35}
.scene-play-icon svg{width:100%;height:100%}
.scene-floor{position:absolute;bottom:0;left:0;right:0;height:38%;background:linear-gradient(to top,rgba(255,46,168,.14) 0%,rgba(228,0,255,.06) 18%,transparent 55%),linear-gradient(to top,rgba(0,229,255,.1) 0%,transparent 45%);filter:blur(1px)}
.scene-sparkles{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 12% 18%,rgba(255,255,255,.9) 0%,transparent 100%),radial-gradient(1px 1px at 78% 24%,rgba(0,229,255,.8) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 44% 12%,rgba(255,46,168,.9) 0%,transparent 100%),radial-gradient(1px 1px at 62% 72%,rgba(255,255,255,.7) 0%,transparent 100%),radial-gradient(1px 1px at 22% 68%,rgba(0,229,255,.6) 0%,transparent 100%),radial-gradient(1px 1px at 88% 58%,rgba(255,46,168,.7) 0%,transparent 100%),radial-gradient(1px 1px at 35% 42%,rgba(255,255,255,.5) 0%,transparent 100%),radial-gradient(1px 1px at 55% 88%,rgba(0,229,255,.5) 0%,transparent 100%)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%{transform:translateX(-4%) scale(1)}100%{transform:translateX(4%) scale(1.04)}}
@keyframes pulseGlow{0%,100%{filter:drop-shadow(0 0 12px rgba(255,46,168,.75)) drop-shadow(0 0 28px rgba(0,229,255,.45))}50%{filter:drop-shadow(0 0 18px rgba(255,46,168,.95)) drop-shadow(0 0 36px rgba(0,229,255,.65))}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:1}
.screen.active{opacity:1;pointer-events:auto}
#screen-game{justify-content:flex-start}
#gameCanvas{display:block;width:100%;height:100%;position:absolute;inset:0}
.panel{position:relative;background:linear-gradient(160deg,rgba(10,8,32,.88),rgba(5,6,18,.92));border-radius:20px;padding:32px 28px 28px;text-align:center;max-width:92vw;border:1px solid rgba(255,46,168,.35);box-shadow:0 0 24px rgba(255,46,168,.15),0 0 40px rgba(0,229,255,.1),inset 0 1px 0 rgba(255,255,255,.08)}
.panel::before{content:'';position:absolute;inset:-1px;border-radius:21px;padding:1px;background:linear-gradient(135deg,rgba(255,46,168,.55),rgba(0,229,255,.45),rgba(255,46,168,.35));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.neon-title{font-size:clamp(2.8rem,12vw,4rem);font-weight:900;letter-spacing:.12em;line-height:1;margin-bottom:6px;background:linear-gradient(90deg,var(--pink) 0%,#ff6ec7 35%,var(--cyan) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:pulseGlow 3s ease-in-out infinite}
.tagline{font-size:.72rem;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.72);margin-bottom:18px}
.panel .subtitle{font-size:.95rem;color:rgba(255,255,255,.82);font-weight:500;margin-bottom:24px;letter-spacing:.04em}
.stat-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px;font-size:1.05rem;font-weight:700;color:#fff;padding:12px 18px;border-radius:12px;background:rgba(255,46,168,.08);border:1px solid rgba(0,229,255,.22)}
.stat-row svg{width:22px;height:22px;flex-shrink:0;filter:drop-shadow(0 0 6px rgba(0,229,255,.6))}
.stat-row span{color:var(--cyan);text-shadow:0 0 10px rgba(0,229,255,.5)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;padding:14px 24px;margin-top:12px;border:none;border-radius:14px;font-size:1.05rem;font-weight:800;cursor:pointer;touch-action:manipulation;color:#fff;background:linear-gradient(90deg,var(--pink),var(--magenta) 45%,var(--cyan));box-shadow:0 0 20px rgba(255,46,168,.45),0 0 32px rgba(0,229,255,.25),0 4px 16px rgba(0,0,0,.35);letter-spacing:.08em;text-transform:uppercase}
.btn svg{filter:drop-shadow(0 0 4px rgba(255,255,255,.6))}
.btn:active{transform:scale(.97);opacity:.92}
.btn-secondary{background:linear-gradient(135deg,rgba(18,8,40,.95),rgba(10,20,50,.95));box-shadow:0 0 12px rgba(0,229,255,.2),inset 0 0 0 1px rgba(0,229,255,.35);border:1px solid rgba(255,46,168,.25);text-transform:none;font-weight:700}
#hud{position:absolute;top:0;left:0;right:0;padding:40px 16px 16px;display:flex;justify-content:center;gap:12px;z-index:10;pointer-events:none}
.hud-chip{background:linear-gradient(135deg,rgba(10,8,32,.85),rgba(5,6,18,.9));border-radius:12px;padding:10px 18px;font-size:1rem;font-weight:700;color:#fff;border:1px solid rgba(255,46,168,.35);min-width:96px;text-align:center;box-shadow:0 0 16px rgba(255,46,168,.15),0 0 20px rgba(0,229,255,.1)}
.hud-chip span{color:var(--cyan);text-shadow:0 0 10px rgba(0,229,255,.65)}
.result-stat{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,46,168,.18);font-size:1.05rem;font-weight:600;color:rgba(255,255,255,.92)}
.result-stat:last-of-type{border-bottom:none;margin-bottom:8px}
.result-stat .val{color:var(--cyan);font-weight:800;font-size:1.15rem;text-shadow:0 0 12px rgba(0,229,255,.55)}
#resultTitle{font-size:clamp(1.6rem,7vw,1.9rem);margin-bottom:20px;background:linear-gradient(90deg,var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(255,46,168,.5)) drop-shadow(0 0 18px rgba(0,229,255,.35))}
</style>
</head>
<body>
<div id="app">
<div class="scene-bg" aria-hidden="true">
<div class="scene-rays"></div>
<div class="scene-streaks"></div>
<div class="scene-rings">
<svg viewBox="0 0 200 200" fill="none"><circle cx="100" cy="100" r="88" stroke="url(#ringGrad)" stroke-width=".8" opacity=".7"/><circle cx="100" cy="100" r="72" stroke="url(#ringGrad)" stroke-width=".6" opacity=".5"/><circle cx="100" cy="100" r="56" stroke="url(#ringGrad)" stroke-width=".5" opacity=".35"/><defs><linearGradient id="ringGrad" x1="0" y1="0" x2="200" y2="200"><stop offset="0%" stop-color="#ff2ea8"/><stop offset="100%" stop-color="#00e5ff"/></linearGradient></defs></svg>
</div>
<div class="scene-play-icon">
<svg viewBox="0 0 120 120" fill="none"><path d="M38 22 L98 60 L38 98 Z" stroke="url(#playGrad)" stroke-width="2.5" stroke-linejoin="round"/><path d="M44 30 L88 60 L44 90 Z" stroke="url(#playGrad2)" stroke-width="1.2" opacity=".6"/><defs><linearGradient id="playGrad" x1="38" y1="22" x2="98" y2="98"><stop offset="0%" stop-color="#ff2ea8"/><stop offset="100%" stop-color="#00e5ff"/></linearGradient><linearGradient id="playGrad2" x1="44" y1="30" x2="88" y2="90"><stop offset="0%" stop-color="#e400ff"/><stop offset="100%" stop-color="#0088ff"/></linearGradient></defs></svg>
</div>
<div class="scene-sparkles"></div>
<div class="scene-floor"></div>
</div>
<div id="screen-menu" class="screen active">
<div class="panel">
<h1 class="neon-title">PLAY</h1>
<p class="tagline">Wall</p>
<p class="subtitle">Tap to turn 90&deg;</p>
<div class="stat-row">
<svg viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
<span>Best: <span id="menuBest">0</span></span>
</div>
<button class="btn" id="btnPlay">
<svg viewBox="0 0 24 24" fill="#fff" width="18" height="18" style="margin-right:10px"><polygon points="5,3 19,12 5,21"/></svg>
Play
</button>
</div>
</div>
<div id="screen-game" class="screen">
<canvas id="gameCanvas"></canvas>
<div id="hud">
<div class="hud-chip">Score: <span id="hudScore">0</span></div>
<div class="hud-chip">Time: <span id="hudTime">0</span>s</div>
</div>
</div>
<div id="screen-result" class="screen">
<div class="panel">
<h1 id="resultTitle">Game Over</h1>
<div class="result-stat"><span>Score</span><span class="val" id="resScore">0</span></div>
<div class="result-stat"><span>Best</span><span class="val" id="resBest">0</span></div>
<div class="result-stat"><span>Wall Bounces</span><span class="val" id="resBounces">0</span></div>
<div class="result-stat"><span>Time Survived</span><span class="val" id="resTime">0s</span></div>
<button class="btn" id="btnAgain">Play Again</button>
<button class="btn btn-secondary" id="btnMenu">Main Menu</button>
</div>
</div>
</div>
<script>
(function(){
var LS_KEY='pw_best';
var SPEED=4;
var BALL_R=10;
var CORNER_SIZE=48;
var PINK='#ff2ea8';
var CYAN='#00e5ff';
var screens={menu:document.getElementById('screen-menu'),game:document.getElementById('screen-game'),result:document.getElementById('screen-result')};
var canvas=document.getElementById('gameCanvas');
var ctx=canvas.getContext('2d');
var state='menu';
var animId=null;
var lastTs=0;
var ball={x:0,y:0,vx:0,vy:0};
var score=0;
var bounces=0;
var elapsed=0;
var startTime=0;
var w=0,h=0;
var particles=[];
var bgPhase=0;
function getBest(){try{return parseInt(localStorage.getItem(LS_KEY)||'0',10)||0}catch(e){return 0}}
function setBest(v){try{localStorage.setItem(LS_KEY,String(v))}catch(e){}}
function showScreen(name){
Object.keys(screens).forEach(function(k){screens[k].classList.toggle('active',k===name)});
state=name;
}
function initParticles(){
particles=[];
var n=Math.floor((w*h)/9000);
if(n<50)n=50;
if(n>120)n=120;
for(var i=0;i<n;i++){
particles.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.8+.4,a:Math.random()*.6+.2,c:Math.random()>.5?PINK:CYAN,sp:Math.random()*.25+.05,ph:Math.random()*Math.PI*2});
}
}
function resizeCanvas(){
w=window.innerWidth;
h=window.innerHeight;
var dpr=window.devicePixelRatio||1;
canvas.width=w*dpr;
canvas.height=h*dpr;
canvas.style.width=w+'px';
canvas.style.height=h+'px';
ctx.setTransform(dpr,0,0,dpr,0,0);
initParticles();
}
var resizeTimer=null;
function onResize(){
clearTimeout(resizeTimer);
resizeTimer=setTimeout(resizeCanvas,80);
}
function initBall(){
ball.x=w/2;
ball.y=h/2;
var angle=Math.PI/4+Math.random()*Math.PI/2;
ball.vx=Math.cos(angle)*SPEED;
ball.vy=Math.sin(angle)*SPEED;
if(Math.random()>.5){ball.vx=-ball.vx}
if(Math.random()>.5){ball.vy=-ball.vy}
}
function rotateVelocity(){
var vx=ball.vx,vy=ball.vy;
ball.vx=vy;
ball.vy=-vx;
}
function inCornerZone(x,y){
return(x<CORNER_SIZE&&y<CORNER_SIZE)||(x>w-CORNER_SIZE&&y<CORNER_SIZE)||(x<CORNER_SIZE&&y>h-CORNER_SIZE)||(x>w-CORNER_SIZE&&y>h-CORNER_SIZE);
}
function updateHUD(){
document.getElementById('hudScore').textContent=score;
document.getElementById('hudTime').textContent=Math.floor(elapsed);
}
function drawBackground(){
bgPhase+=0.012;
var grd=ctx.createLinearGradient(0,0,0,h);
grd.addColorStop(0,'#050818');
grd.addColorStop(.45,'#0a0820');
grd.addColorStop(1,'#120828');
ctx.fillStyle=grd;
ctx.fillRect(0,0,w,h);
var burst=ctx.createRadialGradient(w/2,h*.42,0,w/2,h*.42,Math.max(w,h)*.65);
burst.addColorStop(0,'rgba(255,46,168,.14)');
burst.addColorStop(.35,'rgba(0,229,255,.06)');
burst.addColorStop(1,'rgba(0,0,0,0)');
ctx.fillStyle=burst;
ctx.fillRect(0,0,w,h);
ctx.save();
ctx.translate(w/2,h*.42);
for(var r=0;r<24;r++){
ctx.rotate(Math.PI/12);
ctx.beginPath();
ctx.moveTo(0,0);
ctx.lineTo(Math.max(w,h)*.55,0);
ctx.strokeStyle=r%2===0?'rgba(255,46,168,.04)':'rgba(0,229,255,.03)';
ctx.lineWidth=1;
ctx.stroke();
}
ctx.restore();
ctx.save();
ctx.globalAlpha=.35;
for(var s=0;s<3;s++){
var sy=h*(.35+s*.08)+Math.sin(bgPhase+s)*8;
var sg=ctx.createLinearGradient(0,sy-20,0,sy+20);
sg.addColorStop(0,'rgba(255,46,168,0)');
sg.addColorStop(.5,s%2===0?'rgba(255,46,168,.18)':'rgba(0,229,255,.2)');
sg.addColorStop(1,'rgba(0,229,255,0)');
ctx.fillStyle=sg;
ctx.fillRect(0,sy-24,w,48);
}
ctx.restore();
for(var i=0;i<particles.length;i++){
var p=particles[i];
p.y-=p.sp;
if(p.y<-4){p.y=h+4;p.x=Math.random()*w}
p.x+=Math.sin(bgPhase+p.ph)*.15;
ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fillStyle=p.c;
ctx.globalAlpha=p.a;
ctx.fill();
}
ctx.globalAlpha=1;
var floor=ctx.createLinearGradient(0,h*.62,0,h);
floor.addColorStop(0,'rgba(255,46,168,0)');
floor.addColorStop(.45,'rgba(255,46,168,.1)');
floor.addColorStop(.7,'rgba(0,229,255,.08)');
floor.addColorStop(1,'rgba(0,0,0,.4)');
ctx.fillStyle=floor;
ctx.fillRect(0,h*.62,w,h*.38);
}
function drawCorners(){
ctx.save();
var glow=ctx.createRadialGradient(CORNER_SIZE/2,CORNER_SIZE/2,0,CORNER_SIZE/2,CORNER_SIZE/2,CORNER_SIZE);
glow.addColorStop(0,'rgba(255,46,168,.35)');
glow.addColorStop(1,'rgba(255,46,168,0)');
ctx.fillStyle=glow;
ctx.fillRect(0,0,CORNER_SIZE,CORNER_SIZE);
ctx.fillRect(w-CORNER_SIZE,0,CORNER_SIZE,CORNER_SIZE);
ctx.fillRect(0,h-CORNER_SIZE,CORNER_SIZE,CORNER_SIZE);
ctx.fillRect(w-CORNER_SIZE,h-CORNER_SIZE,CORNER_SIZE,CORNER_SIZE);
ctx.strokeStyle='rgba(255,46,168,.55)';
ctx.lineWidth=1.5;
ctx.shadowColor=PINK;
ctx.shadowBlur=12;
ctx.strokeRect(1,1,CORNER_SIZE-2,CORNER_SIZE-2);
ctx.strokeRect(w-CORNER_SIZE+1,1,CORNER_SIZE-2,CORNER_SIZE-2);
ctx.strokeRect(1,h-CORNER_SIZE+1,CORNER_SIZE-2,CORNER_SIZE-2);
ctx.strokeRect(w-CORNER_SIZE+1,h-CORNER_SIZE+1,CORNER_SIZE-2,CORNER_SIZE-2);
ctx.restore();
}
function drawWalls(){
ctx.save();
ctx.shadowColor=CYAN;
ctx.shadowBlur=14;
var lg=ctx.createLinearGradient(0,0,w,h);
lg.addColorStop(0,PINK);
lg.addColorStop(.5,CYAN);
lg.addColorStop(1,PINK);
ctx.strokeStyle=lg;
ctx.lineWidth=2;
ctx.strokeRect(BALL_R,BALL_R,w-BALL_R*2,h-BALL_R*2);
ctx.restore();
}
function drawBall(){
ctx.save();
ctx.shadowColor=PINK;
ctx.shadowBlur=22;
ctx.beginPath();
ctx.arc(ball.x,ball.y,BALL_R+2,0,Math.PI*2);
ctx.fillStyle='rgba(255,46,168,.35)';
ctx.fill();
ctx.shadowColor=CYAN;
ctx.shadowBlur=18;
ctx.beginPath();
ctx.arc(ball.x,ball.y,BALL_R,0,Math.PI*2);
ctx.fillStyle='#fff';
ctx.fill();
ctx.shadowBlur=0;
ctx.beginPath();
ctx.arc(ball.x,ball.y,BALL_R-3,0,Math.PI*2);
var bg=ctx.createLinearGradient(ball.x-BALL_R,ball.y,ball.x+BALL_R,ball.y);
bg.addColorStop(0,PINK);
bg.addColorStop(1,CYAN);
ctx.fillStyle=bg;
ctx.fill();
ctx.restore();
}
function draw(){
drawBackground();
drawCorners();
drawWalls();
drawBall();
}
function gameOver(){
cancelAnimationFrame(animId);
animId=null;
var best=getBest();
if(score>best){best=score;setBest(best)}
document.getElementById('resScore').textContent=score;
document.getElementById('resBest').textContent=best;
document.getElementById('resBounces').textContent=bounces;
document.getElementById('resTime').textContent=Math.floor(elapsed)+'s';
showScreen('result');
}
function tick(ts){
if(state!=='game')return;
if(!lastTs)lastTs=ts;
var dt=Math.min((ts-lastTs)/16.67,3);
lastTs=ts;
elapsed=(ts-startTime)/1000;
for(var i=0;i<dt;i++){
ball.x+=ball.vx;
ball.y+=ball.vy;
var hitWall=false;
if(ball.x-BALL_R<=0){ball.x=BALL_R;ball.vx=Math.abs(ball.vx);hitWall=true}
else if(ball.x+BALL_R>=w){ball.x=w-BALL_R;ball.vx=-Math.abs(ball.vx);hitWall=true}
if(ball.y-BALL_R<=0){ball.y=BALL_R;ball.vy=Math.abs(ball.vy);hitWall=true}
else if(ball.y+BALL_R>=h){ball.y=h-BALL_R;ball.vy=-Math.abs(ball.vy);hitWall=true}
if(hitWall){score++;bounces++}
if(inCornerZone(ball.x,ball.y)){gameOver();return}
}
updateHUD();
draw();
animId=requestAnimationFrame(tick);
}
function startGame(){
score=0;
bounces=0;
elapsed=0;
lastTs=0;
startTime=performance.now();
resizeCanvas();
initBall();
updateHUD();
draw();
showScreen('game');
if(animId)cancelAnimationFrame(animId);
animId=requestAnimationFrame(tick);
}
function onTap(e){
if(state!=='game')return;
e.preventDefault();
rotateVelocity();
}
document.getElementById('btnPlay').addEventListener('click',startGame);
document.getElementById('btnAgain').addEventListener('click',startGame);
document.getElementById('btnMenu').addEventListener('click',function(){
if(animId){cancelAnimationFrame(animId);animId=null}
document.getElementById('menuBest').textContent=getBest();
showScreen('menu');
});
canvas.addEventListener('touchstart',onTap,{passive:false});
canvas.addEventListener('click',onTap);
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',onResize);
document.getElementById('menuBest').textContent=getBest();
resizeCanvas();
})();
</script>
</body>
</html>
