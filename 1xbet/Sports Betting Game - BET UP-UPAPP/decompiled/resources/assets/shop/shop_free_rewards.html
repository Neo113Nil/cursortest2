<!DOCTYPE html>
<html lang="en" class="shop-video-reward-card">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; background: transparent; overflow: hidden;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #F9FAFD;
    }
    .shop-root { width: 100%; height: 100%; display: flex; min-height: 0; overflow: hidden; }
    .card {
      position: relative; flex: 1; width: 100%; height: 100%; min-height: 0;
      border-radius: 1em; overflow: hidden;
      border: 0.14em solid transparent;
      background:
        linear-gradient(165deg, rgba(28, 28, 34, 0.98) 0%, rgba(14, 14, 18, 0.99) 100%) padding-box,
        linear-gradient(180deg, #FFB03A 0%, #FFB03A 9%, rgba(255, 176, 58, 0.28) 30%, transparent 66%) border-box;
      box-shadow: 0 0 0.45em rgba(255, 176, 58, 0.18), 0 0.35em 1em rgba(0, 0, 0, 0.38);
      display: flex; flex-direction: column;
      opacity: {{cardOpacity}};
    }
    .card::before {
      content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px);
      background-size: 10% 10%;
    }
    .card.is-checking {
      transform-origin: center;
      animation: video-card-pulse 1.4s ease-in-out infinite alternate;
    }
    .card.is-ready {
      transform-origin: center;
      animation: video-card-ready 0.34s ease-out both;
    }
    @keyframes video-card-pulse {
      from { transform: scale(0.995); box-shadow: 0 0 0.38em rgba(255, 176, 58, 0.16), 0 0.35em 1em rgba(0, 0, 0, 0.38); }
      to { transform: scale(1.012); box-shadow: 0 0 0.82em rgba(255, 176, 58, 0.38), 0 0.35em 1em rgba(0, 0, 0, 0.38); }
    }
    @keyframes video-card-ready {
      0% { transform: scale(0.98); }
      48% { transform: scale(1.025); }
      100% { transform: scale(1); }
    }
    .main {
      position: relative; z-index: 1; flex: 1; min-height: 0;
      display: grid; grid-template-columns: 1.05fr 0.95fr;
      align-items: center;
      padding: 0.72em 0.62em 0.48em;
      overflow: hidden;
    }
    .left {
      min-width: 0; min-height: 0;
      display: flex; flex-direction: column; justify-content: center;
      padding-right: 0.28em;
    }
    .title {
      font-size: 1.14em;
      font-weight: 800; color: #FFB03A;
      text-transform: uppercase; letter-spacing: 0.04em; line-height: 1.12;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .subtitle {
      font-size: 0.88em;
      color: #E8E4F0; margin-top: 0.26em; line-height: 1.22;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .checking-dots i {
      font-style: normal;
      opacity: 0.2;
      animation: checking-dot 1.25s ease-in-out infinite;
    }
    .checking-dots i:nth-child(2) { animation-delay: 0.18s; }
    .checking-dots i:nth-child(3) { animation-delay: 0.36s; }
    @keyframes checking-dot {
      0%, 70%, 100% { opacity: 0.2; }
      35% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card.is-checking, .card.is-ready, .checking-dots i { animation: none; }
      .checking-dots i { opacity: 1; }
    }
    .quota-badge {
      display: none;
      align-items: center;
      align-self: flex-start;
      margin-top: 0.34em;
      padding: 0.18em 0.52em;
      border-radius: 0.42em;
      background: rgba(255, 176, 58, 0.16);
      border: 0.06em solid rgba(255, 176, 58, 0.42);
      font-size: 0.72em;
      font-weight: 700;
      color: #FFB03A;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }
    .coins-row {
      display: flex; align-items: center; gap: 0.34em; margin-top: 0.42em; min-width: 0;
    }
    .coins {
      font-size: 1.62em;
      font-weight: 800; color: #FFB03A;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .right {
      position: relative; min-width: 0; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    .play-stack {
      position: relative;
      height: 94%;
      width: auto;
      aspect-ratio: 1;
      max-width: 100%;
      flex-shrink: 0;
    }
    .play-glow {
      position: absolute; inset: 6%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 176, 58, 0.42) 0%, transparent 72%);
    }
    .hero-img {
      position: absolute; left: 50%; top: 50%;
      width: 122%; height: 122%;
      transform: translate(-50%, -50%);
      object-fit: contain; object-position: center;
      pointer-events: none;
    }
    .play-btn {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 58%; aspect-ratio: 1; border-radius: 50%; z-index: 2;
      background: linear-gradient(180deg, #FFD392 0%, #FFB03A 100%);
      box-shadow: 0 0.2em 0.9em rgba(255, 176, 58, 0.45);
      display: flex; align-items: center; justify-content: center;
    }
    .play-btn::after {
      content: ''; width: 0; height: 0; margin-left: 0.14em;
      border-top: 0.52em solid transparent; border-bottom: 0.52em solid transparent;
      border-left: 0.8em solid #131217;
    }
    .loading-spinner {
      display: none; position: absolute; left: 50%; top: 50%; z-index: 3;
      width: 2.7em; height: 2.7em; margin: -1.35em 0 0 -1.35em;
      border: 0.22em solid rgba(255, 176, 58, 0.28);
      border-top-color: #FFB03A; border-radius: 50%;
      animation: video-spin 0.85s linear infinite;
    }
    @keyframes video-spin { to { transform: rotate(360deg); } }
    .cta-bar {
      position: relative; flex-shrink: 0; width: 100%; border: none; cursor: pointer;
      padding: 0.62em 0.75em;
      background: linear-gradient(180deg, #F5D08A 0%, #E8B04A 50%, #D4A056 100%);
      color: #1C1814;
      font-size: 0.96em;
      font-weight: 800;
      letter-spacing: 0.06em;
      border-radius: 0 0 0.85em 0.85em;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      touch-action: manipulation; -webkit-user-select: none; user-select: none;
      transition: transform 0.14s ease, filter 0.14s ease, box-shadow 0.14s ease;
    }
    .cta-bar::after {
      content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.28) 0%, transparent 68%);
      opacity: 0; transition: opacity 0.1s ease;
    }
    .cta-bar:active:not(:disabled) {
      transform: scale(0.98); filter: brightness(0.93);
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.14);
    }
    .cta-bar:active:not(:disabled)::after { opacity: 1; }
    .cta-bar:disabled { opacity: 0.45; cursor: default; }
  </style>
</head>
<body>
  <div class="shop-root">
    <div class="card {{videoStateClass}}" data-section="{{section}}">
      <div class="main">
        <div class="left">
          <div class="title">{{videoTitle}}</div>
          <div class="subtitle">{{videoSubtitle}}<span class="checking-dots" style="display:{{videoCheckingDotsDisplay}}"><i>.</i><i>.</i><i>.</i></span></div>
          <div class="quota-badge" style="display:{{videoQuotaDisplay}}">{{videoQuota}}</div>
          <div class="coins-row">
            <span class="coins">{{betcoins}}</span>
            <img class="coin-icon coin-icon-sm" src="https://qbetapp.info/uploads_api/shop/component_betcoin.svg" alt="" />
          </div>
        </div>
        <div class="right">
          <div class="play-stack">
            <div class="play-glow" style="display:{{playOverlayDisplay}}"></div>
            <img class="hero-img" style="display:{{heroDisplay}};opacity:{{heroOpacity}}" src="{{iconUrl}}" alt="" onerror="this.style.display='none'" />
            <div class="play-btn" style="display:{{playOverlayDisplay}}"></div>
            <div class="loading-spinner" style="display:{{videoLoadingDisplay}}"></div>
          </div>
        </div>
      </div>
      <button type="button" class="cta-bar" id="watchBtn" onclick="handleWatch()">{{buyLabel}}</button>
    </div>
  </div>
  <script>
    var disabled = {{ctaDisabled}};
    if (disabled) document.getElementById('watchBtn').disabled = true;
    function handleWatch() {
      if (disabled) return;
      if (typeof Android !== 'undefined' && Android.watchVideo) {
        Android.watchVideo();
      } else {
        Android.purchase('');
      }
    }
  </script>
</body>
</html>
