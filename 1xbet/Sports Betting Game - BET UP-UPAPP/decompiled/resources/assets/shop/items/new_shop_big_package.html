<!--
  SKU: new_shop_big_package
  Section: BUNDLES
  30 Day Boost | 750k | package_days=30 | copper theme
  Dashboard: paste this entire file into product HTML content (keep {{placeholders}}).
  Vector scale: html class shop-*-card + sizes in em; border fades color → transparent.
  Card aspect on device: 360×520 (half-width grid cell) (Compose shopHtmlAspectRatio).
-->
<!DOCTYPE html>
<html lang="en" class="shop-bundle-card">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <!-- Design ratio {{aspectRatio}} | vector scale: root font-size = % of card height (vh) -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; background: transparent; overflow: hidden;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #F9FAFD;
    }
    .shop-root { width: 100%; height: 100%; display: flex; min-height: 0; overflow: hidden; }
    .card {
      position: relative; flex: 1; width: 100%; height: 100%; min-height: 0;
      border-radius: 1.15em; overflow: hidden;
      border: 0.14em solid transparent;
      background:
        linear-gradient(168deg, rgba(26, 26, 32, 0.98) 0%, rgba(14, 14, 18, 0.99) 100%) padding-box,
        linear-gradient(180deg, {{borderColor}} 0%, {{borderColor}} 9%, rgba(205, 127, 50, 0.26) 30%, transparent 66%) border-box;
      box-shadow: 0 0 0.48em rgba(205, 127, 50, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      display: flex; flex-direction: column;
      opacity: {{cardOpacity}};
    }
    .card::before {
      content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 10% 10%;
    }
    .card[data-days="90"] {
      box-shadow: 0 0 0.48em rgba(192, 192, 200, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }
    .inner {
      position: relative; z-index: 1; flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      padding: 0.58em 0.72em 0;
      overflow: visible;
    }
    .card.entitlement-waiting .inner { padding: 0.52em 0.68em 0; }
    .top {
      flex-shrink: 0; min-width: 0; width: 100%;
      display: flex; flex-direction: column; gap: 0.28em;
    }
    .card.entitlement-waiting .top { gap: 0.18em; }
    .title {
      font-size: 1.06em; font-weight: 800; color: {{titleAccent}}; line-height: 1.1;
      text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .card.entitlement-waiting .title { font-size: 0.98em; line-height: 1.12; }
    .subtitle {
      font-size: 0.82em; color: #C8C4D4; line-height: 1.18;
      text-align: left;
      overflow: hidden; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .coins-row {
      display: flex; align-items: center; justify-content: flex-start; gap: 0.22em;
      min-width: 0;
    }
    .card.entitlement-waiting .coins-row { gap: 0.2em; }
    .coins-per-day {
      font-size: 0.66em; font-weight: 600; color: #C8C4D4;
      display: {{coinsPerDayDisplay}};
    }
    .card.entitlement-waiting .coins-per-day { font-size: 0.62em; }
    .entitlement-block {
      display: none;
      flex-direction: column;
      align-items: stretch;
      gap: 0.16em;
      width: 92%;
      align-self: center;
      margin-top: 0.1em;
      padding: 0.3em 0.38em;
      border-radius: 0.55em;
      background: rgba(255, 176, 58, 0.08);
      border: 0.06em solid rgba(255, 176, 58, 0.22);
    }
    .card.entitlement-waiting .entitlement-block {
      margin-top: 0.1em;
      margin-bottom: 0.02em;
      padding: 0.3em 0.4em;
      gap: 0.14em;
      width: 90%;
    }
    .entitlement-day {
      font-size: 0.72em; font-weight: 700; color: #FFB03A; line-height: 1.2;
    }
    .card.entitlement-waiting .entitlement-day { font-size: 0.66em; line-height: 1.14; }
    .entitlement-timer {
      display: none;
      font-size: 0.68em; font-weight: 600; color: #9A96A8;
      line-height: 1.25;
      word-break: break-word;
    }
    .card.entitlement-waiting .entitlement-timer { font-size: 0.62em; line-height: 1.18; }
    .entitlement-missed {
      display: none;
      font-size: 0.66em; color: #E88B8B; line-height: 1.2;
    }
    .progress-track {
      width: 100%; height: 0.28em; border-radius: 999px;
      background: rgba(255, 255, 255, 0.1); overflow: hidden;
    }
    .card.entitlement-waiting .progress-track { height: 0.22em; }
    .progress-fill {
      height: 100%; border-radius: inherit;
      background: linear-gradient(90deg, #FFB03A 0%, #E8B04A 100%);
      width: 0%;
      transition: width 0.2s ease;
    }
    .coins {
      font-size: 1.38em; font-weight: 800; color: #FFB03A;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .card.entitlement-waiting .coins { font-size: 1.22em; }
    .lower {
      flex: 1 1 0; min-height: 0;
      display: flex; flex-direction: column;
      overflow: visible;
    }
    .card.entitlement-waiting .lower { justify-content: flex-start; }
    .cta-wrap {
      flex-shrink: 0; width: 90%; align-self: center;
      margin-top: 0.32em;
    }
    .card.entitlement-waiting .cta-wrap {
      margin-top: 0.2em;
      width: 86%;
    }
    .cta {
      position: relative; border: none; border-radius: 999px; cursor: pointer; width: 100%;
      padding: 0.56em 0.68em;
      background: linear-gradient(180deg, rgba(110, 52, 28, 0.98) 0%, rgba(72, 34, 16, 0.99) 100%);
      color: #FFB03A; font-size: 0.96em; font-weight: 800;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      touch-action: manipulation; -webkit-user-select: none; user-select: none;
      transition: transform 0.14s ease, filter 0.14s ease, box-shadow 0.14s ease;
    }
    .card.entitlement-waiting .cta {
      padding: 0.46em 0.58em;
      font-size: 0.86em;
    }
    .cta::after {
      content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(255, 176, 58, 0.22) 0%, transparent 68%);
      opacity: 0; transition: opacity 0.1s ease;
    }
    .cta:active {
      transform: scale(0.965); filter: brightness(1.08);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.28);
    }
    .cta:active::after { opacity: 1; }
    .cta.is-disabled {
      opacity: 0.42;
      filter: grayscale(0.4);
      cursor: default;
      color: #8A8698;
    }
    .cta.is-disabled:active {
      transform: none;
      filter: grayscale(0.4);
      box-shadow: none;
    }
    .cta.is-disabled:active::after { opacity: 0; }
    .card[data-days="90"] .cta {
      background: linear-gradient(180deg, rgba(58, 58, 66, 0.98) 0%, rgba(38, 38, 46, 0.99) 100%);
      color: #E8E8F0;
    }
    .hero-stage {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      margin-top: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: visible;
    }
    .hero-glow {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 145%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(
        ellipse 70% 64% at 50% 82%,
        rgba(255, 176, 58, 0.34) 0%,
        rgba(205, 127, 50, 0.14) 38%,
        rgba(205, 127, 50, 0.04) 58%,
        transparent 78%
      );
    }
    .card[data-days="90"] .hero-glow {
      background: radial-gradient(
        ellipse 70% 64% at 50% 82%,
        rgba(220, 220, 232, 0.28) 0%,
        rgba(180, 180, 195, 0.12) 38%,
        rgba(160, 160, 175, 0.04) 58%,
        transparent 78%
      );
    }
    .hero-img {
      position: relative;
      width: 108%;
      height: auto;
      max-height: none;
      object-fit: contain;
      object-position: bottom center;
      pointer-events: none;
      z-index: 1;
      vertical-align: bottom;
    }
  </style>
</head>
<body>
  <div class="shop-root">
    <div class="card {{cardEntitlementClass}}" data-section="{{section}}" data-days="{{packageDays}}">
      <div class="inner">
        <div class="top">
          <div class="title">{{title}}</div>
          <div class="subtitle" style="display:{{subtitleDisplay}}">{{subtitle}}</div>
          <div class="coins-row">
            <span class="coins">{{betcoins}}</span>
            <img class="coin-icon coin-icon-sm" src="https://qbetapp.info/uploads_api/shop/component_betcoin.svg" alt="" />
            <span class="coins-per-day">{{coinsPerDaySuffix}}</span>
          </div>
        </div>
        <div class="lower">
          <div class="entitlement-block" style="display:{{entitlementDisplay}}">
            <div class="entitlement-day">{{entitlementProgress}}</div>
            <div class="entitlement-timer" id="claimTimer" style="display:{{entitlementTimerDisplay}}" data-format="{{entitlementTimerFormat}}">{{entitlementTimerInitial}}</div>
            <div class="progress-track" aria-hidden="true">
              <div class="progress-fill" style="width:{{entitlementProgressPct}}%"></div>
            </div>
            <div class="entitlement-missed" style="display:{{entitlementMissedDisplay}}">{{entitlementMissed}}</div>
          </div>
          <div class="cta-wrap">
            <button type="button" class="cta {{ctaDisabledClass}}" onclick="handleCta()">{{buyLabel}}</button>
          </div>
          <div class="hero-stage">
            <div class="hero-glow" aria-hidden="true"></div>
            <img class="hero-img" style="display:{{heroDisplay}}" src="{{iconUrl}}" alt="" onerror="this.style.display='none'" />
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var el = document.getElementById('claimTimer');
      var nextAt = {{nextClaimAtMillis}};
      if (!el || !nextAt || nextAt <= 0) return;
      var format = el.getAttribute('data-format') || '%1$s';
      function pad(n) { return n < 10 ? '0' + n : String(n); }
      function formatRemaining(ms) {
        var total = Math.max(0, Math.floor(ms / 1000));
        var h = Math.floor(total / 3600);
        var m = Math.floor((total % 3600) / 60);
        var s = total % 60;
        return pad(h) + ':' + pad(m) + ':' + pad(s);
      }
      function tick() {
        var remaining = nextAt - Date.now();
        if (remaining <= 0) {
          el.style.display = 'none';
          return;
        }
        el.style.display = 'block';
        el.textContent = format.replace('%1$s', formatRemaining(remaining));
      }
      tick();
      setInterval(tick, 1000);
    })();

    function handleCta() {
      if ({{ctaDisabled}}) return;
      Android.purchase('{{storeCode}}');
    }
  </script>
</body>
</html>
