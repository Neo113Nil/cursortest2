<!DOCTYPE html>
<html lang="en" class="shop-section-header-timer">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; background: transparent; overflow: hidden;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .timer-wrap {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: flex-end;
      gap: 0.32em; color: #B8B4C0; font-size: 1em; font-weight: 600; white-space: nowrap;
    }
    .timer-label { flex-shrink: 0; }
    .timer-value {
      font-family: ui-monospace, 'SF Mono', 'Roboto Mono', monospace;
      font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
      color: #D1CDD8; min-width: 4.8em; text-align: right; flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="timer-wrap" id="timerWrap">
    <span class="timer-label">{{resetLabel}}</span>
    <span class="timer-value" id="timerValue">00:00:00</span>
  </div>
  <script>
    (function () {
      var resetAt = {{resetAtMillis}};
      var wrap = document.getElementById('timerWrap');
      var valueEl = document.getElementById('timerValue');
      if (!wrap || !valueEl || !resetAt || resetAt <= 0) {
        if (wrap) wrap.style.display = 'none';
        return;
      }
      function pad(n) { return n < 10 ? '0' + n : String(n); }
      function formatRemaining(ms) {
        var total = Math.max(0, Math.floor(ms / 1000));
        var h = Math.floor(total / 3600);
        var m = Math.floor((total % 3600) / 60);
        var s = total % 60;
        return pad(h) + ':' + pad(m) + ':' + pad(s);
      }
      function tick() {
        var remaining = resetAt - Date.now();
        valueEl.textContent = remaining <= 0 ? '00:00:00' : formatRemaining(remaining);
      }
      tick();
      setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
