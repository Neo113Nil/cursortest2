<!DOCTYPE html>
<html lang="en" class="shop-coin-pack-card">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <!-- Design ratio {{aspectRatio}} | vector scale: root font-size = % of card height (vh) -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; background: transparent; overflow: hidden;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #F9FAFD;
    }
    .shop-root { width: 100%; height: 100%; display: flex; min-height: 0; overflow: hidden; }
    .card-frame {
      position: relative; flex: 1; width: 100%; height: 100%; min-height: 0; overflow: visible;
    }
    .card {
      position: relative; width: 100%; height: 100%; min-height: 0;
      border-radius: 1.15em; overflow: hidden;
      border: 0.14em solid transparent;
      background:
        linear-gradient(168deg, rgba(26, 26, 32, 0.98) 0%, rgba(14, 14, 18, 0.99) 100%) padding-box,
        linear-gradient(180deg, {{borderColor}} 0%, {{borderColor}} 9%, rgba(205, 127, 50, 0.24) 30%, transparent 66%) border-box;
      box-shadow: 0 0 0.48em rgba(205, 127, 50, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      display: flex; flex-direction: column;
      opacity: {{cardOpacity}};
    }
    .card::before {
      content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 10% 10%;
    }
    .card[data-ribbon="ribbon-green"] {
      box-shadow: 0 0 0.52em rgba(232, 184, 74, 0.26), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .card[data-ribbon="ribbon-blue"] {
      box-shadow: 0 0 0.52em rgba(155, 109, 255, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .card[data-ribbon="ribbon-silver"] {
      box-shadow: 0 0 0.48em rgba(192, 192, 200, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .corner-ribbon {
      display: {{cornerRibbonDisplay}}; position: absolute; top: 0.72em; right: -1.72em; z-index: 6;
      transform: rotate(45deg); font-size: 0.72em; font-weight: 800;
      letter-spacing: 0.02em; padding: 0.34em 2.15em; color: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }
    .corner-ribbon.ribbon-green { background: linear-gradient(180deg, #34D058, #22A847); }
    .corner-ribbon.ribbon-blue { background: linear-gradient(180deg, #5EEAD4, #2DD4BF); color: #0F172A; }
    .corner-ribbon.ribbon-silver { background: linear-gradient(180deg, #CBD5E1, #94A3B8); color: #131217; }
    .inner {
      position: relative; z-index: 1; flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      padding: 0.88em 0.76em 0;
      overflow: visible;
    }
    .top { flex-shrink: 0; width: 100%; }
    .title {
      font-size: 1.12em; font-weight: 800; color: {{titleAccent}}; line-height: 1.18;
      text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .value-block {
      flex-shrink: 0; width: 100%; text-align: center;
      margin-top: 0.52em;
      display: flex; flex-direction: column; align-items: center; gap: 0.38em;
    }
    .coins-row {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.32em; max-width: 100%;
    }
    .coins {
      font-size: 1.52em; font-weight: 800; color: #FFB03A;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .unit-price {
      display: {{unitPriceDisplay}}; align-items: center; justify-content: center; gap: 0.24em;
      font-size: 0.82em; color: #9E9AA8; font-weight: 600;
    }
    .lower {
      flex: 1 1 0; min-height: 0;
      display: flex; flex-direction: column;
      overflow: visible;
    }
    .cta-wrap {
      flex-shrink: 0; width: 92%; align-self: center;
      margin-top: 0.52em;
    }
    .cta {
      position: relative; border: none; border-radius: 999px; cursor: pointer; width: 100%;
      padding: 0.68em 0.75em;
      background: linear-gradient(180deg, rgba(110, 52, 28, 0.98) 0%, rgba(72, 34, 16, 0.99) 100%);
      color: #FFB03A; font-size: 1.05em; font-weight: 800;
      box-shadow: inset 0 1px 0 rgba(255, 176, 58, 0.14);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      touch-action: manipulation; -webkit-user-select: none; user-select: none;
      transition: transform 0.14s ease, filter 0.14s ease, box-shadow 0.14s ease;
    }
    .cta::after {
      content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(255, 176, 58, 0.22) 0%, transparent 68%);
      opacity: 0; transition: opacity 0.1s ease;
    }
    .cta:active {
      transform: scale(0.965); filter: brightness(0.94);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.22);
    }
    .cta:active::after { opacity: 1; }
    .card[data-ribbon="ribbon-green"] .cta {
      background: linear-gradient(180deg, #F5D078 0%, #E8B84A 100%);
      color: #1A1208; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }
    .card[data-ribbon="ribbon-blue"] .cta {
      background: linear-gradient(180deg, rgba(130, 90, 220, 0.98) 0%, rgba(88, 55, 170, 0.99) 100%);
      color: #F5F0FF;
    }
    .card[data-ribbon="ribbon-silver"] .cta {
      background: linear-gradient(180deg, rgba(58, 58, 66, 0.98) 0%, rgba(38, 38, 46, 0.99) 100%);
      color: #E8E8F0;
    }
    .hero-stage {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      margin-top: 0.1em;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: visible;
    }
    .hero-glow {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 145%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(
        ellipse 70% 64% at 50% 82%,
        rgba(255, 176, 58, 0.32) 0%,
        rgba(205, 127, 50, 0.12) 38%,
        rgba(205, 127, 50, 0.04) 58%,
        transparent 78%
      );
    }
    .card[data-ribbon="ribbon-green"] .hero-glow {
      background: radial-gradient(
        ellipse 70% 64% at 50% 82%,
        rgba(255, 200, 80, 0.36) 0%,
        rgba(232, 184, 74, 0.14) 38%,
        transparent 78%
      );
    }
    .card[data-ribbon="ribbon-blue"] .hero-glow {
      background: radial-gradient(
        ellipse 70% 64% at 50% 82%,
        rgba(140, 110, 255, 0.28) 0%,
        rgba(100, 70, 200, 0.1) 38%,
        transparent 78%
      );
    }
    .card[data-ribbon="ribbon-silver"] .hero-glow {
      background: radial-gradient(
        ellipse 70% 64% at 50% 82%,
        rgba(220, 220, 232, 0.24) 0%,
        rgba(180, 180, 195, 0.1) 38%,
        transparent 78%
      );
    }
    .hero-img {
      position: relative;
      width: 118%;
      height: auto;
      max-height: none;
      object-fit: contain;
      object-position: bottom center;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="shop-root">
    <div class="card-frame">
      <div class="corner-ribbon {{cornerRibbonClass}}">{{cornerRibbonText}}</div>
      <div class="card" data-section="{{section}}" data-ribbon="{{cornerRibbonClass}}">
        <div class="inner">
          <div class="top">
            <div class="title">{{title}}</div>
          </div>
          <div class="value-block">
              <div class="coins-row">
                <span class="coins">{{betcoins}}</span>
                <img class="coin-icon coin-icon-sm" src="https://qbetapp.info/uploads_api/shop/component_betcoin.svg" alt="" />
              </div>
              <div class="unit-price">{{unitPrice}}<img class="coin-icon coin-icon-xs" src="https://qbetapp.info/uploads_api/shop/component_betcoin.svg" alt="" /></div>
          </div>
          <div class="lower">
            <div class="cta-wrap">
              <button type="button" class="cta" onclick="handleCta()">{{buyLabel}}</button>
            </div>
            <div class="hero-stage">
              <div class="hero-glow" aria-hidden="true"></div>
              <img class="hero-img" style="display:{{heroDisplay}}" src="{{iconUrl}}" alt="" onerror="this.style.display='none'" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    function handleCta() {
      if ({{ctaDisabled}}) return;
      Android.purchase('{{storeCode}}');
    }
  </script>
</body>
</html>
